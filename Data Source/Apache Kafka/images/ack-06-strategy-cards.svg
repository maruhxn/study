<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 564" width="880" height="564" role="img" aria-label="상태 검증이 있는 흐름, 건너뛰면 안 되는 흐름, 독립적 레코드의 장기 장애, 파싱 오류, 배치 리스너 다섯 상황별 재시도 전략 카드"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
