  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="564" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">상황이 정하는 재시도 전략</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">다섯 가지 상황에서 무엇을 고르나</text><rect x="24" y="72" width="264" height="228" rx="10" class="bgN stN" stroke-width="1.5"/><text x="40" y="100" class="ink" font-size="13" text-anchor="start" font-weight="700">상태 검증이 있는 흐름</text><text x="40" y="119" class="ink2" font-size="12" text-anchor="start">잘못된 전이는 실패해 격리된다</text><rect x="52" y="150" width="42" height="42" rx="7" class="bgG stG" stroke-width="1.5"/><text x="73.0" y="175.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">1</text><text x="90" y="162" class="txG" font-size="11" text-anchor="end" font-weight="700">✓</text><rect x="114" y="150" width="42" height="42" rx="7" class="bgB stB" stroke-width="1.5"/><text x="135.0" y="175.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">2</text><rect x="176" y="150" width="42" height="42" rx="7" class="bgN stN" stroke-width="1.5"/><text x="197.0" y="175.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">3</text><text x="40" y="216" class="ink2" font-size="11" text-anchor="start">재시도 중에는 뒤 레코드가 기다린다</text><rect x="36" y="240" width="240" height="50" rx="8" class="bgB stB" stroke-width="1.5"/><text x="156" y="259.7" class="ink" font-size="12" text-anchor="middle">블로킹 재시도, 짧게</text><text x="156" y="278.7" class="ink" font-size="12" text-anchor="middle">끝내 실패하면 DLT</text><rect x="308" y="72" width="264" height="228" rx="10" class="bgN stN" stroke-width="1.5"/><text x="324" y="100" class="ink" font-size="13" text-anchor="start" font-weight="700">건너뛰면 업무가 틀어지는 흐름</text><text x="324" y="119" class="ink2" font-size="12" text-anchor="start">DLT 재처리는 역전된 채 반영된다</text><rect x="336" y="150" width="42" height="42" rx="7" class="bgR stR" stroke-width="1.5"/><text x="357.0" y="175.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">2</text><text x="374" y="162" class="txR" font-size="11" text-anchor="end" font-weight="700">✕</text><rect x="398" y="150" width="42" height="42" rx="7" class="bgN stN" stroke-width="1.5"/><text x="419.0" y="175.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">3</text><line x1="388.0" y1="142" x2="388.0" y2="200" class="lnR" stroke-width="3"/><text x="324" y="216" class="ink2" font-size="11" text-anchor="start">멈춰서 뒤의 레코드도 기다린다</text><rect x="320" y="240" width="240" height="50" rx="8" class="bgA stA" stroke-width="1.5"/><text x="440" y="259.7" class="ink" font-size="12" text-anchor="middle">블로킹 재시도 후 pause()</text><text x="440" y="278.7" class="ink" font-size="12" text-anchor="middle">+ 알림, 고친 뒤 resume()</text><rect x="592" y="72" width="264" height="228" rx="10" class="bgN stN" stroke-width="1.5"/><text x="608" y="100" class="ink" font-size="13" text-anchor="start" font-weight="700">독립적 레코드 + 회복에 분·시간</text><text x="608" y="119" class="ink2" font-size="12" text-anchor="start">외부 API 장애</text><rect x="620" y="132" width="42" height="42" rx="7" class="bgG stG" stroke-width="1.5"/><text x="641.0" y="157.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">1</text><text x="658" y="144" class="txG" font-size="11" text-anchor="end" font-weight="700">✓</text><rect x="682" y="132" width="42" height="42" rx="7" class="bgG stG" stroke-width="1.5"/><text x="703.0" y="157.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">2</text><text x="720" y="144" class="txG" font-size="11" text-anchor="end" font-weight="700">✓</text><rect x="744" y="132" width="42" height="42" rx="7" class="bgG stG" stroke-width="1.5"/><text x="765.0" y="157.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">3</text><text x="782" y="144" class="txG" font-size="11" text-anchor="end" font-weight="700">✓</text><rect x="806" y="132" width="42" height="42" rx="7" class="bgA stA" stroke-width="1.5"/><text x="827.0" y="157.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">4</text><rect x="620" y="182" width="104" height="26" rx="5" class="bgN stN" stroke-width="1.5" stroke-dasharray="5 4"/><text x="672" y="199" class="ink2" font-size="10" text-anchor="middle">retry 토픽</text><path d="M827.0,176 C827.0,195 770,195 726,195" class="lnB" stroke-width="1.6" marker-end="url(#mB)"/><text x="608" y="230" class="ink2" font-size="11" text-anchor="start">실패한 4번만 빠지고 나머지는 계속</text><rect x="604" y="240" width="240" height="50" rx="8" class="bgG stG" stroke-width="1.5"/><text x="724" y="259.7" class="ink" font-size="12" text-anchor="middle">@RetryableTopic</text><text x="724" y="278.7" class="ink" font-size="12" text-anchor="middle">원본 처리량 유지, 긴 지연 가능</text><rect x="24" y="312" width="264" height="228" rx="10" class="bgN stN" stroke-width="1.5"/><text x="40" y="340" class="ink" font-size="13" text-anchor="start" font-weight="700">재시도해도 같은 결과</text><text x="40" y="359" class="ink2" font-size="12" text-anchor="start">파싱·검증 오류</text><rect x="52" y="390" width="42" height="42" rx="7" class="bgR stR" stroke-width="1.5"/><text x="73.0" y="415.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">7</text><text x="90" y="402" class="txR" font-size="11" text-anchor="end" font-weight="700">✕</text><line x1="100" y1="411" x2="170" y2="411" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="172" y="392" width="104" height="38" rx="8" class="bgR stR" stroke-width="1.5"/><text x="224" y="415.2" class="ink" font-size="12" text-anchor="middle">orders-dlt</text><text x="40" y="456" class="ink2" font-size="11" text-anchor="start">몇 번을 해도 같은 결과</text><rect x="36" y="480" width="240" height="50" rx="8" class="bgR stR" stroke-width="1.5"/><text x="156" y="499.7" class="ink" font-size="12" text-anchor="middle">not-retryable 등록</text><text x="156" y="518.7" class="ink" font-size="12" text-anchor="middle">즉시 DLT, 재시도 슬롯 낭비 없음</text><rect x="308" y="312" width="264" height="228" rx="10" class="bgN stN" stroke-width="1.5"/><text x="324" y="340" class="ink" font-size="13" text-anchor="start" font-weight="700">배치 리스너 · 컨테이너 트랜잭션</text><text x="324" y="359" class="ink2" font-size="12" text-anchor="start">@RetryableTopic 미지원</text><rect x="336" y="382" width="42" height="42" rx="7" class="bgG stG" stroke-width="1.5"/><text x="357.0" y="407.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">1</text><text x="374" y="394" class="txG" font-size="11" text-anchor="end" font-weight="700">✓</text><rect x="398" y="382" width="42" height="42" rx="7" class="bgG stG" stroke-width="1.5"/><text x="419.0" y="407.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">2</text><text x="436" y="394" class="txG" font-size="11" text-anchor="end" font-weight="700">✓</text><rect x="460" y="382" width="42" height="42" rx="7" class="bgR stR" stroke-width="1.5"/><text x="481.0" y="407.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">3</text><text x="498" y="394" class="txR" font-size="11" text-anchor="end" font-weight="700">✕</text><rect x="522" y="382" width="42" height="42" rx="7" class="bgN stN" stroke-width="1.5"/><text x="543.0" y="407.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">4</text><path d="M336,437 V444 H564 V437" class="lnN" stroke-width="1.6"/><text x="324" y="468" class="ink2" font-size="11" text-anchor="start">index=3 → 앞 두 건 커밋, 3번째부터 재시도</text><rect x="320" y="480" width="240" height="50" rx="8" class="bgN stN" stroke-width="1.5"/><text x="440" y="499.7" class="ink" font-size="12" text-anchor="middle">DefaultErrorHandler</text><text x="440" y="518.7" class="ink" font-size="12" text-anchor="middle">+ BatchListenerFailedException</text><rect x="592" y="312" width="264" height="228" rx="10" class="bgN stN" stroke-width="1.5" stroke-dasharray="5 4"/><text x="608" y="340" class="ink" font-size="13" text-anchor="start" font-weight="700">고르는 기준</text><circle cx="614" cy="372" r="11" class="solB"/><text x="614" y="376.5" class="wh" font-size="13" text-anchor="middle" font-weight="700">1</text><text x="632" y="377" class="ink" font-size="12" text-anchor="start">앞 이벤트 없이 뒤를 처리해도 되나</text><circle cx="614" cy="412" r="11" class="solB"/><text x="614" y="416.5" class="wh" font-size="13" text-anchor="middle" font-weight="700">2</text><text x="632" y="417" class="ink" font-size="12" text-anchor="start">실패가 몇 초가 아니라</text><text x="632" y="435" class="ink" font-size="12" text-anchor="start">분·시간 걸리나</text><circle cx="614" cy="472" r="11" class="solB"/><text x="614" y="476.5" class="wh" font-size="13" text-anchor="middle" font-weight="700">3</text><text x="632" y="477" class="ink" font-size="12" text-anchor="start">재시도해도 소용없는 예외인가</text></svg>