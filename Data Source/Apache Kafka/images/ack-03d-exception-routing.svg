<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="예외 종류별로 성공 처리, 재시도, DLT로 나뉘는 경로 그림"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="410" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">예외마다 가는 길이 다르다</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">DefaultErrorHandler의 분류와 업무 예외를 직접 분류했을 때의 경로</text><text x="24" y="82" class="ink2" font-size="12" text-anchor="start">리스너에서 예외가 올라왔을 때 어디로 보낼까</text><rect x="24" y="112" width="400" height="48" rx="8" class="bgG stG" stroke-width="1.5"/><text x="36" y="133" class="ink mono" font-size="12" text-anchor="start" font-weight="600">DuplicateKeyException</text><text x="36" y="150" class="ink2" font-size="11" text-anchor="start">멱등 유니크 위반</text><rect x="24" y="172" width="400" height="48" rx="8" class="bgA stA" stroke-width="1.5"/><text x="36" y="193" class="ink mono" font-size="12" text-anchor="start" font-weight="600">TimeoutException · QueryTimeoutException</text><text x="36" y="210" class="ink2" font-size="11" text-anchor="start">연결 오류 · 락 획득 실패</text><rect x="24" y="232" width="400" height="48" rx="8" class="bgA stA" stroke-width="1.5" stroke-dasharray="5 4"/><text x="36" y="253" class="ink" font-size="12" text-anchor="start" font-weight="600">처음 보는 새 예외</text><text x="36" y="270" class="ink2" font-size="11" text-anchor="start">분류표에 아직 없음</text><rect x="24" y="292" width="400" height="48" rx="8" class="bgR stR" stroke-width="1.5"/><text x="36" y="313" class="ink mono" font-size="12" text-anchor="start" font-weight="600">JsonProcessingException · IllegalArgumentException</text><text x="36" y="330" class="ink2" font-size="11" text-anchor="start">DataIntegrityViolationException</text><rect x="600" y="104" width="256" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="728.0" y="130.7" class="ink" font-size="12" text-anchor="middle">성공 처리 (ack)</text><text x="728.0" y="149.7" class="ink" font-size="12" text-anchor="middle">실패가 아니라 이미 처리됨</text><rect x="600" y="180" width="256" height="120" rx="8" class="bgA stA" stroke-width="1.5"/><text x="728.0" y="215.7" class="ink" font-size="12" text-anchor="middle">재시도</text><text x="728.0" y="234.7" class="ink" font-size="12" text-anchor="middle">시간이 지나면 풀릴 수 있다</text><text x="728.0" y="253.7" class="ink" font-size="12" text-anchor="middle">모르는 예외도 이쪽</text><text x="728.0" y="272.7" class="ink" font-size="12" text-anchor="middle">(유실보다 지연이 낫다)</text><rect x="600" y="310" width="256" height="64" rx="8" class="bgR stR" stroke-width="1.5"/><text x="728.0" y="336.7" class="ink" font-size="12" text-anchor="middle">recoverer → DLT</text><text x="728.0" y="355.7" class="ink" font-size="12" text-anchor="middle">몇 번을 해도 같은 결과</text><line x1="424" y1="136" x2="600" y2="136" class="lnG" stroke-width="1.6" marker-end="url(#mG)"/><line x1="424" y1="196" x2="600" y2="210" class="lnA" stroke-width="1.6" marker-end="url(#mA)"/><line x1="424" y1="256" x2="600" y2="256" class="lnA" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mA)"/><line x1="424" y1="316" x2="600" y2="342" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><text x="24" y="372" class="muted" font-size="11" text-anchor="start">기본으로 재시도하지 않는 예외는 6개뿐이다: DeserializationException, MessageConversionException,</text><text x="24" y="388" class="muted" font-size="11" text-anchor="start">ConversionException, MethodArgumentResolutionException, NoSuchMethodException, ClassCastException</text></svg>