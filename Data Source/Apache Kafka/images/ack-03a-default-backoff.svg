 height="50" rx="7" class="bgR stR" stroke-width="1.5"/><text x="571.0" y="130.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">10</text><text x="592" y="112" class="txR" font-size="11" text-anchor="end" font-weight="700">✕</text><text x="24" y="172" class="txR" font-size="12" text-anchor="start" font-weight="600">간격 없이 연달아 시도, 매번 같은 이유로 실패</text><line x1="612" y1="125" x2="650" y2="125" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="656" y="98" width="200" height="54" rx="8" class="bgA stA" stroke-width="1.5"/><text x="756.0" y="129.9" class="ink" font-size="14" text-anchor="middle" font-weight="600">ERROR 로그 한 줄</text><line x1="756" y1="152" x2="756" y2="196" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="24" y="200" width="520" height="62" rx="8" class="bgN stN" stroke-width="1.5"/><text x="284.0" y="235.6" class="ink" font-size="13" text-anchor="middle">오프셋이 커밋돼 그 레코드는 다시 오지 않는다</text><rect x="656" y="200" width="200" height="62" rx="8" class="bgN stN" stroke-width="1.5"/><text x="756.0" y="235.6" class="ink" font-size="13" text-anchor="middle">다음 레코드로 넘어간다</text><line x1="656" y1="231" x2="548" y2="231" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="24" y="292" width="832" height="60" rx="8" class="bgR stR" stroke-width="1.5"/><text x="440.0" y="326.6" class="ink" font-size="13" text-anchor="middle" font-weight="600">결제 이벤트가 이 경로로 처리되지 않은 채 사라진 사례가 있다. 알림도 에러도 남지 않는 조용한 유실이다</text></svg>