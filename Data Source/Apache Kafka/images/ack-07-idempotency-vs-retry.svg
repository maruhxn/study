<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 526" width="880" height="526" role="img" aria-label="처리 기록을 별도 트랜잭션에 두면 크래시 후 중복으로 판단되어 유실되고 같은 트랜잭션에 두면 롤백되어 정상 재처리되는 비교"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="526" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">처리 기록을 남기는 위치가 재시도 결과를 바꾼다</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">처리 기록(processed_events)을 어느 트랜잭션에 두느냐에 따라 같은 크래시가 유실이 되기도 한다</text><rect x="24" y="72" width="408" height="430" rx="10" class="bgR stR" stroke-width="1.5"/><text x="40" y="98" class="ink" font-size="13" text-anchor="start" font-weight="700">기록을 별도 트랜잭션(REQUIRES_NEW)으로 먼저 커밋</text><rect x="448" y="72" width="408" height="430" rx="10" class="bgG stG" stroke-width="1.5"/><text x="464" y="98" class="ink" font-size="13" text-anchor="start" font-weight="700">기록과 업무 변경을 같은 DB 트랜잭션에</text><rect x="44" y="118" width="368" height="48" rx="8" class="bgN stN" stroke-width="1.5"/><text x="228.0" y="146.2" class="ink" font-size="12" text-anchor="middle">① processed_events 기록이 먼저 커밋된다</text><rect x="468" y="118" width="368" height="48" rx="8" class="bgN stN" stroke-width="1.5"/><text x="652.0" y="146.2" class="ink" font-size="12" text-anchor="middle">① INSERT … ON CONFLICT DO NOTHING + 업무 변경</text><line x1="228" y1="166" x2="228" y2="192" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="652" y1="166" x2="652" y2="192" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="44" y="192" width="368" height="48" rx="8" class="bgR stR" stroke-width="1.5"/><text x="228.0" y="220.2" class="ink" font-size="12" text-anchor="middle" font-weight="600">② 업무 처리 도중 프로세스 크래시</text><rect x="468" y="192" width="368" height="48" rx="8" class="bgN stN" stroke-width="1.5"/><text x="652.0" y="220.2" class="ink" font-size="12" text-anchor="middle">② 크래시 → 롤백, 기록도 함께 사라진다</text><line x1="228" y1="240" x2="228" y2="266" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="652" y1="240" x2="652" y2="266" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="44" y="266" width="368" height="48" rx="8" class="bgN stN" stroke-width="1.5"/><text x="228.0" y="294.2" class="ink" font-size="12" text-anchor="middle">③ 오프셋 미커밋 → 같은 이벤트 재전달</text><rect x="468" y="266" width="368" height="48" rx="8" class="bgN stN" stroke-width="1.5"/><text x="652.0" y="294.2" class="ink" font-size="12" text-anchor="middle">③ 재전달 → 영향 행 1 → 처음처럼 처리</text><line x1="228" y1="314" x2="228" y2="340" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="652" y1="314" x2="652" y2="340" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="44" y="340" width="368" height="48" rx="8" class="bgR stR" stroke-width="1.5"/><text x="228.0" y="368.2" class="ink" font-size="12" text-anchor="middle" font-weight="600">④ 기록이 있어 중복으로 판단 → ack → 유실</text><rect x="468" y="340" width="368" height="48" rx="8" class="bgG stG" stroke-width="1.5"/><text x="652.0" y="368.2" class="ink" font-size="12" text-anchor="middle" font-weight="600">④ 재시도·DLT 재처리가 모두 정상 동작</text><rect x="44" y="428" width="368" height="56" rx="8" class="bgN stN" stroke-width="1.5"/><text x="56" y="450" class="ink" font-size="11" text-anchor="start" font-weight="600">업무 실패 + 재시도 안 함 → DLT, 기록은 남는다</text><text x="56" y="468" class="txR" font-size="11" text-anchor="start" font-weight="600">같은 이벤트 ID로 재발행해도 중복으로 걸러진다</text><text x="468" y="440" class="ink2" font-size="12" text-anchor="start">기록 보관 기간은 재처리 가능 기간</text><text x="468" y="460" class="ink2" font-size="12" text-anchor="start">(Kafka 보관 기간, DLT 재발행 기간)보다 길게</text></svg>