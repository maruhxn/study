<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" role="img" aria-label="배치는 batch.size가 차거나 linger.ms가 지나면 전송 가능해지고, 버퍼 전체인 buffer.memory가 가득 차면 send()가 max.block.ms까지 기다린 뒤 실패하는 모습"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="344" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">버퍼는 전체 메모리, 배치는 그 안의 파티션별 묶음</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">왼쪽: 배치가 전송 가능해지는 조건 · 오른쪽: 버퍼 전체가 찼을 때</text><rect x="24" y="72" width="400" height="250" rx="10" class="stB" fill="none" stroke-width="1.2" stroke-dasharray="4 4"/><text x="36" y="92" class="txB" font-size="12" text-anchor="start" font-weight="700">배치는 언제 나가나 (파티션 P0)</text><text x="44" y="118" class="ink mono" font-size="12" text-anchor="start" font-weight="700">batch.size</text><text x="140" y="118" class="muted" font-size="12" text-anchor="start">기본 16KB</text><rect x="44" y="130" width="360" height="26" rx="5" class="bgN stN" stroke-width="1.2"/><rect x="44" y="130" width="250" height="26" rx="5" class="bgB stB" stroke-width="1.2"/><text x="169" y="148" class="ink" font-size="11" text-anchor="middle">레코드가 쌓인 양</text><text x="44" y="194" class="ink mono" font-size="12" text-anchor="start" font-weight="700">linger.ms</text><text x="140" y="194" class="muted" font-size="12" text-anchor="start">기본 5ms (Kafka 4.0~)</text><rect x="44" y="206" width="360" height="26" rx="5" class="bgN stN" stroke-width="1.2"/><rect x="44" y="206" width="360" height="26" rx="5" class="bgA stA" stroke-width="1.2"/><text x="224" y="224" class="ink" font-size="11" text-anchor="middle">첫 레코드 이후 기다린 시간 → 다 참</text><rect x="44" y="254" width="360" height="48" rx="8" class="bgG stG" stroke-width="1.5"/><text x="224.0" y="273.3" class="ink" font-size="12" text-anchor="middle">둘 중 하나만 채워져도 전송 가능</text><text x="224.0" y="291.3" class="ink" font-size="12" text-anchor="middle">16KB가 안 돼도 5ms가 지나면 보낸다</text><rect x="448" y="72" width="408" height="250" rx="10" class="stR" fill="none" stroke-width="1.2" stroke-dasharray="4 4"/><text x="460" y="92" class="txR" font-size="12" text-anchor="start" font-weight="700">버퍼가 가득 차면</text><text x="468" y="118" class="ink mono" font-size="12" text-anchor="start" font-weight="700">buffer.memory</text><text x="580" y="118" class="muted" font-size="12" text-anchor="start">기본 32MB, 모든 파티션이 나눠 씀</text><rect x="468" y="130" width="40" height="26" rx="4" class="bgR stR" stroke-width="1.2"/><rect x="514" y="130" width="40" height="26" rx="4" class="bgR stR" stroke-width="1.2"/><rect x="560" y="130" width="40" height="26" rx="4" class="bgR stR" stroke-width="1.2"/><rect x="606" y="130" width="40" height="26" rx="4" class="bgR stR" stroke-width="1.2"/><rect x="652" y="130" width="40" height="26" rx="4" class="bgR stR" stroke-width="1.2"/><rect x="698" y="130" width="40" height="26" rx="4" class="bgR stR" stroke-width="1.2"/><rect x="744" y="130" width="40" height="26" rx="4" class="bgR stR" stroke-width="1.2"/><rect x="790" y="130" width="40" height="26" rx="4" class="bgR stR" stroke-width="1.2"/><rect x="468" y="180" width="170" height="48" rx="8" class="bgA stA" stroke-width="1.5"/><text x="553.0" y="199.3" class="ink" font-size="12" text-anchor="middle">send()가 반환하지 않고</text><text x="553.0" y="217.3" class="ink" font-size="12" text-anchor="middle">공간이 날 때까지 대기</text><line x1="638" y1="204" x2="666" y2="204" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="668" y="180" width="168" height="48" rx="8" class="bgR stR" stroke-width="1.5"/><text x="752.0" y="199.3" class="ink" font-size="12" text-anchor="middle">max.block.ms(60초)</text><text x="752.0" y="217.3" class="ink" font-size="12" text-anchor="middle">넘으면 실패한 Future</text><text x="468" y="258" class="ink2" font-size="12" text-anchor="start">원인: 브로커로 나가는 속도보다 앱이 넣는 속도가 빠름</text><text x="468" y="280" class="ink2" font-size="12" text-anchor="start">조용히 버리지 않고 호출자를 멈춰 알린다</text><text x="468" y="302" class="muted" font-size="12" text-anchor="start">(웹 요청 스레드라면 요청도 같이 멈춘다)</text></svg>