" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="369.0" y="127.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">3</text><rect x="400" y="104" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="419.0" y="127.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">4</text><rect x="450" y="104" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="469.0" y="127.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">5</text><rect x="500" y="104" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="519.0" y="127.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">6</text><line x1="294" y1="98" x2="294" y2="152" class="lnA" stroke-width="3"/><line x1="344" y1="98" x2="344" y2="152" class="lnA" stroke-width="3"/><line x1="394" y1="98" x2="394" y2="152" class="lnA" stroke-width="3"/><line x1="444" y1="98" x2="444" y2="152" class="lnA" stroke-width="3"/><line x1="494" y1="98" x2="494" y2="152" class="lnA" stroke-width="3"/><line x1="544" y1="98" x2="544" y2="152" class="lnA" stroke-width="3"/><text x="590" y="122" class="ink" font-size="12" text-anchor="start">레코드마다 커밋, 커밋 요청이 많다</text><text x="590" y="140" class="ink2" font-size="12" text-anchor="start">재처리 범위가 작다</text><text x="24" y="196" class="ink mono" font-size="13" text-anchor="start" font-weight="700">BATCH (기본)</text><text x="24" y="214" class="ink2" font-size="11" text-anchor="start">받은 묶음을 다 처리한 뒤</text><rect x="250" y="180" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="269.0" y="203.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">1</text><rect x="300" y="180" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="319.0" y="203.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">2</text><rect x="350" y="180" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="369.0" y="203.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">3</text><rect x="400" y="180" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="419.0" y="203.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">4</text><rect x="450" y="180" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="469.0" y="203.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">5</text><rect x="500" y="180" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="519.0" y="203.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">6</text><line x1="544" y1="174" x2="544" y2="228" class="lnA" stroke-width="3"/><text x="590" y="198" class="ink" font-size="12" text-anchor="start">커밋 횟수가 적다</text><text x="590" y="216" class="ink2" font-size="12" text-anchor="start">중간에 죽으면 묶음 단위로 재처리</text><text x="24" y="272" class="ink mono" font-size="13" text-anchor="start" font-weight="700">COUNT (ackCount=3)</text><text x="24" y="290" class="ink2" font-size="11" text-anchor="start">BATCH + 3건 수신마다</text><rect x="250" y="256" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="269.0" y="279.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">1</text><rect x="300" y="256" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="319.0" y="279.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">2</text><rect x="350" y="256" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="369.0" y="279.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">3</text><rect x="400" y="256" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="419.0" y="279.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">4</text><rect x="450" y="256" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="469.0" y="279.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">5</text><rect x="500" y="256" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="519.0" y="279.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">6</text><line x1="394" y1="250" x2="394" y2="304" class="lnA" stroke-width="3"/><line x1="544" y1="250" x2="544" y2="304" class="lnA" stroke-width="3"/><text x="590" y="274" class="ink" font-size="12" text-anchor="start">TIME은 시간, COUNT_TIME은 먼저 만족한 쪽</text><text x="590" y="292" class="ink2" font-size="12" text-anchor="start">커밋 빈도를 설정으로 조절</text><text x="24" y="348" class="ink mono" font-size="13" text-anchor="start" font-weight="700">MANUAL_IMMEDIATE</text><text x="24" y="366" class="ink2" font-size="11" text-anchor="start">acknowledge() 호출 즉시</text><rect x="250" y="332" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="269.0" y="355.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">1</text><rect x="300" y="332" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="319.0" y="355.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">2</text><rect x="350" y="332" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="369.0" y="355.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">3</text><rect x="400" y="332" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="419.0" y="355.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">4</text><rect x="450" y="332" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="469.0" y="355.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">5</text><rect x="500" y="332" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="519.0" y="355.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">6</text><line x1="344" y1="326" x2="344" y2="380" class="lnA" stroke-width="3"/><line x1="494" y1="326" x2="494" y2="380" class="lnA" stroke-width="3"/><text x="319" y="324" class="txA mono" font-size="11" text-anchor="middle" font-weight="700">ack()</text><text x="469" y="324" class="txA mono" font-size="11" text-anchor="middle" font-weight="700">ack()</text><text x="590" y="350" class="ink" font-size="12" text-anchor="start">코드가 완료 시점을 정한다</text><text x="590" y="368" class="ink2" font-size="12" text-anchor="start">가장 보수적인 방식</text><line x1="24" y1="412" x2="44" y2="412" class="lnA" stroke-width="3"/><text x="52" y="416" class="ink2" font-size="12" text-anchor="start">오프셋 커밋 시점</text></svg>