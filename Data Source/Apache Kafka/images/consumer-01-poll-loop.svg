<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="poll, 역직렬화, 리스너 처리, 오프셋 커밋을 반복하는 루프와, 파티션 로그에서 커밋 오프셋 43과 현재 위치 46 사이 구간이 장애 때 다시 오는 모습"><style>
