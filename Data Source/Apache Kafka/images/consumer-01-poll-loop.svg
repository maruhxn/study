</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="420" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">컨슈머가 레코드를 받아 처리 완료로 기록하기까지</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">Spring 리스너 컨테이너의 스레드 하나가 이 네 단계를 계속 반복한다</text><rect x="24" y="76" width="186" height="56" rx="8" class="bgB stB" stroke-width="1.5"/><text x="117.0" y="99.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">① poll()</text><text x="117.0" y="117.3" class="ink" font-size="12" text-anchor="middle">레코드 묶음 가져오기</text><line x1="210" y1="104" x2="236" y2="104" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="238" y="76" width="186" height="56" rx="8" class="bgN stN" stroke-width="1.5"/><text x="331.0" y="99.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">② 역직렬화</text><text x="331.0" y="117.3" class="ink" font-size="12" text-anchor="middle">바이트 → 객체</text><line x1="424" y1="104" x2="450" y2="104" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="452" y="76" width="186" height="56" rx="8" class="bgN stN" stroke-width="1.5"/><text x="545.0" y="99.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">③ 리스너 호출</text><text x="545.0" y="117.3" class="ink" font-size="12" text-anchor="middle">업무 처리</text><line x1="638" y1="104" x2="664" y2="104" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="666" y="76" width="186" height="56" rx="8" class="bgG stG" stroke-width="1.5"/><text x="759.0" y="99.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">④ 오프셋 커밋</text><text x="759.0" y="117.3" class="ink" font-size="12" text-anchor="middle">AckMode가 시점 결정</text><path d="M760,132 C760,166 117,166 117,134" class="lnI" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mI)"/><text x="438" y="182" class="ink2" font-size="12" text-anchor="middle">다시 ①로</text><text x="24" y="214" class="ink" font-size="13" text-anchor="start" font-weight="700">파티션 P0의 로그</text><rect x="24" y="228" width="84" height="44" rx="8" class="bgG stG" stroke-width="1.5"/><text x="66.0" y="255.0" class="ink" font-size="14" text-anchor="middle">40</text><rect x="116" y="228" width="84" height="44" rx="8" class="bgG stG" stroke-width="1.5"/><text x="158.0" y="255.0" class="ink" font-size="14" text-anchor="middle">41</text><rect x="208" y="228" width="84" height="44" rx="8" class="bgG stG" stroke-width="1.5"/><text x="250.0" y="255.0" class="ink" font-size="14" text-anchor="middle">42</text><rect x="300" y="228" width="84" height="44" rx="8" class="bgB stB" stroke-width="1.5"/><text x="342.0" y="255.0" class="ink" font-size="14" text-anchor="middle">43</text><rect x="392" y="228" width="84" height="44" rx="8" class="bgB stB" stroke-width="1.5"/><text x="434.0" y="255.0" class="ink" font-size="14" text-anchor="middle">44</text><rect x="484" y="228" width="84" height="44" rx="8" class="bgB stB" stroke-width="1.5"/><text x="526.0" y="255.0" class="ink" font-size="14" text-anchor="middle">45</text><rect x="576" y="228" width="84" height="44" rx="8" class="bgN stN" stroke-width="1.5"/><text x="618.0" y="255.0" class="ink" font-size="14" text-anchor="middle">46</text><rect x="668" y="228" width="84" height="44" rx="8" class="bgN stN" stroke-width="1.5"/><text x="710.0" y="255.0" class="ink" font-size="14" text-anchor="middle">47</text><rect x="760" y="228" width="84" height="44" rx="8" class="bgN stN" stroke-width="1.5"/><text x="802.0" y="255.0" class="ink" font-size="14" text-anchor="middle">48</text><text x="300" y="296" class="txG" font-size="12" text-anchor="start" font-weight="700">▲ 커밋 오프셋 = 43</text><text x="300" y="314" class="ink2" font-size="12" text-anchor="start">다음에 읽을 위치. 장애·재시작 뒤 여기부터</text><text x="576" y="296" class="txB" font-size="12" text-anchor="start" font-weight="700">▲ 현재 위치(position) = 46</text><text x="576" y="314" class="ink2" font-size="12" text-anchor="start">다음 poll()이 가져올 위치</text><rect x="24" y="336" width="268" height="34" rx="8" class="bgG stG" stroke-width="1.5"/><text x="158.0" y="357.3" class="ink" font-size="12" text-anchor="middle">40~42 처리 완료, 커밋됨</text><rect x="304" y="336" width="268" height="34" rx="8" class="bgB stB" stroke-width="1.5"/><text x="438.0" y="357.3" class="ink" font-size="12" text-anchor="middle">43~45 가져와서 처리 중</text><rect x="584" y="336" width="272" height="34" rx="8" class="bgN stN" stroke-width="1.5"/><text x="720.0" y="357.3" class="ink" font-size="12" text-anchor="middle">46~ 아직 안 가져옴</text><text x="24" y="400" class="ink2" font-size="12" text-anchor="start">43~45는 이미 가져왔지만 커밋 전이다. 지금 컨슈머가 죽으면 이 구간이 다시 온다.</text></svg>