.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="492" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">운영 컨슈머에서 반드시 정해 둘 곳</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">메시지가 흐르는 길 위에서 직접 지정해야 하는 지점 네 곳</text><rect x="24" y="84" width="130" height="56" rx="8" class="bgN stN" stroke-width="1.5"/><text x="89.0" y="106.8" class="ink" font-size="13" text-anchor="middle">Kafka</text><text x="89.0" y="126.3" class="ink" font-size="13" text-anchor="middle">토픽</text><rect x="184" y="84" width="190" height="56" rx="8" class="bgB stB" stroke-width="1.5"/><text x="279.0" y="107.2" class="ink" font-size="12" text-anchor="middle">리스너 컨테이너</text><text x="279.0" y="125.2" class="ink" font-size="12" text-anchor="middle">커밋 시점을 정한다</text><rect x="404" y="84" width="190" height="56" rx="8" class="bgN stN" stroke-width="1.5"/><text x="499.0" y="107.2" class="ink" font-size="12" text-anchor="middle">리스너</text><text x="499.0" y="125.2" class="ink" font-size="12" text-anchor="middle">멱등 처리</text><rect x="624" y="84" width="232" height="56" rx="8" class="bgG stG" stroke-width="1.5"/><text x="740.0" y="116.2" class="ink" font-size="12" text-anchor="middle">성공 → ack, 오프셋 커밋</text><line x1="154" y1="112" x2="184" y2="112" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="374" y1="112" x2="404" y2="112" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="594" y1="112" x2="624" y2="112" class="lnG" stroke-width="1.6" marker-end="url(#mG)"/><line x1="499" y1="140" x2="499" y2="190" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><text x="512" y="170" class="txR" font-size="12" text-anchor="start" font-weight="600">예외</text><rect x="404" y="192" width="190" height="56" rx="8" class="bgA stA" stroke-width="1.5"/><text x="499.0" y="215.2" class="ink" font-size="12" text-anchor="middle">DefaultErrorHandler</text><text x="499.0" y="233.2" class="ink" font-size="12" text-anchor="middle">횟수·간격 + 예외 분류</text><rect x="624" y="192" width="232" height="56" rx="8" class="bgR stR" stroke-width="1.5"/><text x="740.0" y="215.2" class="ink" font-size="12" text-anchor="middle">DeadLetterPublishingRecoverer</text><text x="740.0" y="233.2" class="ink" font-size="12" text-anchor="middle">→ orders-dlt</text><line x1="594" y1="220" x2="624" y2="220" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><path d="M499,192 C499,166 270,166 270,142" class="lnA" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mA)"/><text x="330" y="186" class="txA" font-size="12" text-anchor="start" font-weight="600">재시도</text><circle cx="184" cy="84" r="11" class="solB"/><text x="184" y="88.5" class="wh" font-size="13" text-anchor="middle" font-weight="700">1</text><circle cx="404" cy="192" r="11" class="solA"/><text x="404" y="196.5" class="wh" font-size="13" text-anchor="middle" font-weight="700">2</text><circle cx="594" cy="192" r="11" class="solA"/><text x="594" y="196.5" class="wh" font-size="13" text-anchor="middle" font-weight="700">3</text><circle cx="856" cy="192" r="11" class="solR"/><text x="856" y="196.5" class="wh" font-size="13" text-anchor="middle" font-weight="700">4</text><circle cx="36" cy="290" r="11" class="solB"/><text x="36" y="294.5" class="wh" font-size="13" text-anchor="middle" font-weight="700">1</text><text x="58" y="295" class="ink" font-size="13" text-anchor="start" font-weight="700">커밋</text><text x="160" y="295" class="ink2" font-size="12" text-anchor="start">enable.auto.commit은 켜지 않는다. 기본 BATCH로 충분하고, 완료 시점을 표시해야 하면 MANUAL_IMMEDIATE</text><circle cx="36" cy="330" r="11" class="solA"/><text x="36" y="334.5" class="wh" font-size="13" text-anchor="middle" font-weight="700">2</text><text x="58" y="335" class="ink" font-size="13" text-anchor="start" font-weight="700">에러 핸들러</text><text x="160" y="335" class="ink2" font-size="12" text-anchor="start">기본값(10번 시도 후 로그만)을 그대로 두지 않는다. 횟수·간격과 DLT recoverer를 명시</text><circle cx="36" cy="370" r="11" class="solA"/><text x="36" y="374.5" class="wh" font-size="13" text-anchor="middle" font-weight="700">3</text><text x="58" y="375" class="ink" font-size="13" text-anchor="start" font-weight="700">예외 분류</text><text x="160" y="375" class="ink2" font-size="12" text-anchor="start">파싱·검증 실패는 not-retryable, 모르는 예외는 재시도 쪽에 두고 DLT 유입 알림으로 보완</text><circle cx="36" cy="410" r="11" class="solR"/><text x="36" y="414.5" class="wh" font-size="13" text-anchor="middle" font-weight="700">4</text><text x="58" y="415" class="ink" font-size="13" text-anchor="start" font-weight="700">DLT</text><text x="160" y="415" class="ink2" font-size="12" text-anchor="start">파티션 수, 발행 실패 처리, 알림, 재처리 절차를 정한다. 재처리는 같은 이벤트 ID + 멱등 소비</text><text x="24" y="468" class="txB" font-size="12" text-anchor="start" font-weight="600">재시도 방식은 순서가 중요하면 블로킹을 짧게, 순서 무관 + 긴 장애면 @RetryableTopic</text></svg>