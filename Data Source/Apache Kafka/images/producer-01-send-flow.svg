<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 436" width="880" height="436" role="img" aria-label="앱 스레드가 직렬화와 파티션 선택 후 레코드를 파티션별 배치 버퍼에 넣고 반환하면, Sender 스레드가 배치를 리더 브로커별로 보내고 응답이 오면 Future와 콜백이 완료되는 흐름"><style>
