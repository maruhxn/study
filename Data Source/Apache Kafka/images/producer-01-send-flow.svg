</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="436" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">send() 한 번이 브로커에 닿기까지</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">앱 스레드는 버퍼에 넣고 돌아오고, 네트워크 전송은 Sender 스레드가 따로 한다</text><rect x="24" y="72" width="236" height="262" rx="10" class="stB" fill="none" stroke-width="1.2" stroke-dasharray="4 4"/><text x="36" y="92" class="txB" font-size="12" text-anchor="start" font-weight="700">① 앱 스레드 (send 호출)</text><rect x="44" y="104" width="196" height="50" rx="8" class="bgN stN" stroke-width="1.5"/><text x="142.0" y="124.3" class="ink" font-size="12" text-anchor="middle">send(record)</text><text x="142.0" y="142.3" class="ink" font-size="12" text-anchor="middle">토픽·키·값</text><rect x="44" y="182" width="196" height="50" rx="8" class="bgN stN" stroke-width="1.5"/><text x="142.0" y="202.3" class="ink" font-size="12" text-anchor="middle">직렬화</text><text x="142.0" y="220.3" class="ink" font-size="12" text-anchor="middle">키·값 → 바이트</text><rect x="44" y="260" width="196" height="50" rx="8" class="bgN stN" stroke-width="1.5"/><text x="142.0" y="280.3" class="ink" font-size="12" text-anchor="middle">파티셔너</text><text x="142.0" y="298.3" class="ink" font-size="12" text-anchor="middle">몇 번 파티션인지 결정</text><line x1="142" y1="154" x2="142" y2="180" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="142" y1="232" x2="142" y2="258" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="284" y="72" width="290" height="262" rx="10" class="stA" fill="none" stroke-width="1.2" stroke-dasharray="4 4"/><text x="296" y="92" class="txA" font-size="12" text-anchor="start" font-weight="700">② 레코드 버퍼 (buffer.memory)</text><text x="300" y="138" class="ink mono" font-size="13" text-anchor="start" font-weight="700">P0</text><rect x="334" y="112" width="104" height="40" rx="8" class="bgG stG" stroke-width="1.5"/><text x="386.0" y="136.3" class="ink" font-size="12" text-anchor="middle">배치 (가득)</text><rect x="450" y="112" width="104" height="40" rx="8" class="bgN stN" stroke-width="1.5" stroke-dasharray="5 4"/><text x="502.0" y="136.0" class="ink" font-size="11" text-anchor="middle">배치 (채우는 중)</text><text x="300" y="204" class="ink mono" font-size="13" text-anchor="start" font-weight="700">P1</text><rect x="334" y="178" width="104" height="40" rx="8" class="bgN stN" stroke-width="1.5"/><text x="386.0" y="202.3" class="ink" font-size="12" text-anchor="middle">배치</text><text x="300" y="270" class="ink mono" font-size="13" text-anchor="start" font-weight="700">P2</text><rect x="334" y="244" width="104" height="40" rx="8" class="bgN stN" stroke-width="1.5"/><text x="386.0" y="268.3" class="ink" font-size="12" text-anchor="middle">배치</text><rect x="450" y="244" width="104" height="40" rx="8" class="bgN stN" stroke-width="1.5" stroke-dasharray="5 4"/><text x="502.0" y="268.0" class="ink" font-size="11" text-anchor="middle">배치 (채우는 중)</text><text x="300" y="316" class="ink2" font-size="12" text-anchor="start">파티션마다 배치 큐가 따로 있다</text><path d="M240,285 C262,285 262,226 282,226" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="598" y="72" width="118" height="262" rx="10" class="stB" fill="none" stroke-width="1.2" stroke-dasharray="4 4"/><text x="610" y="92" class="txB" font-size="12" text-anchor="start" font-weight="700">③ Sender</text><text x="657" y="130" class="ink" font-size="12" text-anchor="middle">보낼 수 있는</text><text x="657" y="148" class="ink" font-size="12" text-anchor="middle">배치를 꺼내</text><text x="657" y="176" class="ink" font-size="12" text-anchor="middle">리더 브로커별</text><text x="657" y="194" class="ink" font-size="12" text-anchor="middle">요청 하나로</text><text x="657" y="212" class="ink" font-size="12" text-anchor="middle">묶어 전송</text><text x="657" y="300" class="muted" font-size="11" text-anchor="middle">백그라운드 스레드</text><line x1="574" y1="160" x2="596" y2="160" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="740" y="92" width="116" height="76" rx="8" class="bgN stN" stroke-width="1.5"/><text x="798.0" y="125.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">브로커 1</text><text x="798.0" y="143.3" class="ink" font-size="12" text-anchor="middle">P0·P2 리더</text><rect x="740" y="196" width="116" height="76" rx="8" class="bgN stN" stroke-width="1.5"/><text x="798.0" y="229.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">브로커 2</text><text x="798.0" y="247.3" class="ink" font-size="12" text-anchor="middle">P1 리더</text><line x1="716" y1="140" x2="738" y2="130" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="716" y1="220" x2="738" y2="232" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><path d="M798,272 L798,372 L160,372 L160,336" class="lnG" stroke-width="1.6" marker-end="url(#mG)"/><rect x="330" y="352" width="260" height="40" rx="8" class="bgG stG" stroke-width="1.5"/><text x="460.0" y="376.3" class="ink" font-size="12" text-anchor="middle">④ 응답 → Future·콜백 완료</text><text x="24" y="418" class="ink2" font-size="12" text-anchor="start">send()는 ①이 끝나면 반환한다. 저장 여부는 ④에서 결과로 알 수 있다.</text></svg>