  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="400" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">컨테이너를 멈추는 두 방법</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">stop()은 그룹에서 빠지고, pause()는 그룹에 남는다</text><rect x="24" y="72" width="832" height="144" rx="10" class="bgN stN" stroke-width="1.5"/><text x="40" y="100" class="ink mono" font-size="13" text-anchor="start" font-weight="700">stop()</text><text x="40" y="119" class="ink2" font-size="12" text-anchor="start">poll 루프를 끝내고 KafkaConsumer를 닫는다</text><rect x="40" y="138" width="176" height="60" rx="8" class="bgR stR" stroke-width="1.5"/><text x="128.0" y="163" class="ink" font-size="12" text-anchor="middle" font-weight="600">인스턴스 A</text><text x="128.0" y="182" class="ink2" font-size="11" text-anchor="middle">P0 오프셋 42 실패</text><rect x="248" y="138" width="176" height="60" rx="8" class="bgN stN" stroke-width="1.5"/><text x="336.0" y="163" class="ink" font-size="12" text-anchor="middle" font-weight="600">A의 컨테이너 정지</text><text x="336.0" y="182" class="ink2" font-size="11" text-anchor="middle">컨슈머를 닫고 그룹 이탈</text><line x1="218" y1="168.0" x2="245" y2="168.0" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="456" y="138" width="176" height="60" rx="8" class="bgR stR" stroke-width="1.5"/><text x="544.0" y="163" class="ink" font-size="12" text-anchor="middle" font-weight="600">리밸런싱: P0 → B</text><text x="544.0" y="182" class="ink2" font-size="11" text-anchor="middle">B도 42에서 실패</text><line x1="426" y1="168.0" x2="453" y2="168.0" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="664" y="138" width="176" height="60" rx="8" class="bgA stA" stroke-width="1.5"/><text x="752.0" y="163" class="ink" font-size="12" text-anchor="middle" font-weight="600">B의 컨테이너도 정지</text><text x="752.0" y="182" class="ink2" font-size="11" text-anchor="middle">인스턴스가 하나씩 멈춘다</text><line x1="634" y1="168.0" x2="661" y2="168.0" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="24" y="232" width="832" height="144" rx="10" class="bgN stN" stroke-width="1.5"/><text x="40" y="260" class="ink mono" font-size="13" text-anchor="start" font-weight="700">pause()</text><text x="40" y="279" class="ink2" font-size="12" text-anchor="start">poll()은 계속 부르되 레코드를 받지 않는다</text><rect x="40" y="298" width="176" height="60" rx="8" class="bgR stR" stroke-width="1.5"/><text x="128.0" y="323" class="ink" font-size="12" text-anchor="middle" font-weight="600">인스턴스 A</text><text x="128.0" y="342" class="ink2" font-size="11" text-anchor="middle">P0 오프셋 42 실패</text><rect x="248" y="298" width="176" height="60" rx="8" class="bgA stA" stroke-width="1.5"/><text x="336.0" y="323" class="ink" font-size="12" text-anchor="middle" font-weight="600">A의 컨테이너 pause</text><text x="336.0" y="342" class="ink2" font-size="11" text-anchor="middle">poll()은 0건 반환</text><line x1="218" y1="328.0" x2="245" y2="328.0" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="456" y="298" width="176" height="60" rx="8" class="bgN stN" stroke-width="1.5"/><text x="544.0" y="323" class="ink" font-size="12" text-anchor="middle" font-weight="600">그룹에 남는다</text><text x="544.0" y="342" class="ink2" font-size="11" text-anchor="middle">리밸런싱 없음, 랙만 쌓임</text><line x1="426" y1="328.0" x2="453" y2="328.0" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="664" y="298" width="176" height="60" rx="8" class="bgG stG" stroke-width="1.5"/><text x="752.0" y="323" class="ink" font-size="12" text-anchor="middle" font-weight="600">원인 수정 후 resume</text><text x="752.0" y="342" class="ink2" font-size="11" text-anchor="middle">42부터 다시 처리</text><line x1="634" y1="328.0" x2="661" y2="328.0" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/></svg>