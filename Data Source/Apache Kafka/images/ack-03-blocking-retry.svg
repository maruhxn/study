<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-label="예외가 나면 seek, backoff 대기, 다시 처리를 반복하다 성공하면 커밋, 소진되면 recoverer를 호출하는 흐름"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="350" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">DefaultErrorHandler는 같은 자리에서 다시 시도한다</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">레코드 4번이 실패했을 때의 블로킹 재시도 한 바퀴</text><rect x="24" y="84" width="150" height="62" rx="8" class="bgR stR" stroke-width="1.5"/><text x="99.0" y="109.8" class="ink" font-size="13" text-anchor="middle">리스너가</text><text x="99.0" y="129.3" class="ink" font-size="13" text-anchor="middle">예외를 던진다</text><rect x="214" y="84" width="160" height="62" rx="8" class="bgN stN" stroke-width="1.5"/><text x="294.0" y="110.2" class="ink" font-size="12" text-anchor="middle">DefaultErrorHandler</text><text x="294.0" y="128.2" class="ink" font-size="12" text-anchor="middle">실패 레코드로 seek</text><rect x="414" y="84" width="150" height="62" rx="8" class="bgA stA" stroke-width="1.5"/><text x="489.0" y="109.8" class="ink" font-size="13" text-anchor="middle">backoff 대기</text><text x="489.0" y="129.3" class="ink" font-size="13" text-anchor="middle">컨슈머 스레드 정지</text><rect x="604" y="84" width="150" height="62" rx="8" class="bgB stB" stroke-width="1.5"/><text x="679.0" y="109.8" class="ink" font-size="13" text-anchor="middle">다시 poll·처리</text><text x="679.0" y="129.3" class="ink" font-size="13" text-anchor="middle"></text><line x1="174" y1="115" x2="214" y2="115" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="374" y1="115" x2="414" y2="115" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="564" y1="115" x2="604" y2="115" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><path d="M679,84 C679,50 294,50 294,82" class="lnR" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mR)"/><text x="486" y="56" class="txR" font-size="12" text-anchor="middle" font-weight="600">또 실패하면 반복</text><line x1="640" y1="146" x2="560" y2="206" class="lnG" stroke-width="1.6" marker-end="url(#mG)"/><line x1="718" y1="146" x2="760" y2="206" class="lnA" stroke-width="1.6" marker-end="url(#mA)"/><rect x="404" y="206" width="190" height="60" rx="8" class="bgG stG" stroke-width="1.5"/><text x="499.0" y="231.2" class="ink" font-size="12" text-anchor="middle">성공</text><text x="499.0" y="249.2" class="ink" font-size="12" text-anchor="middle">커밋하고 다음 레코드로</text><rect x="660" y="206" width="196" height="60" rx="8" class="bgA stA" stroke-width="1.5"/><text x="758.0" y="231.2" class="ink" font-size="12" text-anchor="middle">재시도 소진</text><text x="758.0" y="249.2" class="ink" font-size="12" text-anchor="middle">recoverer 호출 → 커밋 → 다음</text><text x="24" y="200" class="ink" font-size="13" text-anchor="start" font-weight="700">같은 파티션, 같은 순서로</text><rect x="24" y="214" width="46" height="46" rx="7" class="bgB stB" stroke-width="1.5"/><text x="47.0" y="242.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">4</text><rect x="80" y="214" width="46" height="46" rx="7" class="bgN stN" stroke-width="1.5"/><text x="103.0" y="242.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">5</text><rect x="136" y="214" width="46" height="46" rx="7" class="bgN stN" stroke-width="1.5"/><text x="159.0" y="242.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">6</text><text x="24" y="288" class="ink2" font-size="12" text-anchor="start">4번이 끝날 때까지 5·6번은 기다린다</text><text x="24" y="322" class="muted" font-size="12" text-anchor="start">예외 → seek → 대기 → 다시 처리 → … → 재시도 소진 → recoverer → 커밋</text></svg>