<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" width="880" height="336" role="img" aria-label="send() 호출부터 반환까지는 max.block.ms가, 반환부터 버퍼 대기와 요청·재시도를 거쳐 결과가 확정될 때까지는 delivery.timeout.ms가 제한하는 타임라인"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="336" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">send() 전후의 두 시간 제한</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">앞쪽은 호출한 스레드가 멈추는 시간, 뒤쪽은 결과가 확정될 때까지의 시간</text><line x1="24" y1="150" x2="852" y2="150" class="lnN" stroke-width="1.6" marker-end="url(#mN)"/><circle cx="40" cy="150" r="6" class="solI"/><text x="40" y="182" class="ink" font-size="12" text-anchor="middle" font-weight="600">send() 호출</text><rect x="56" y="128" width="170" height="44" rx="8" class="bgA stA" stroke-width="1.5"/><text x="141.0" y="145.5" class="ink" font-size="11" text-anchor="middle">메타데이터 조회</text><text x="141.0" y="162.5" class="ink" font-size="11" text-anchor="middle">버퍼 공간 확보</text><circle cx="240" cy="150" r="6" class="solB"/><text x="240" y="182" class="txB" font-size="12" text-anchor="middle" font-weight="600">send() 반환</text><rect x="254" y="128" width="120" height="44" rx="8" class="bgN stN" stroke-width="1.5"/><text x="314.0" y="145.5" class="ink" font-size="11" text-anchor="middle">버퍼에서 대기</text><text x="314.0" y="162.5" class="ink" font-size="11" text-anchor="middle">(linger.ms)</text><rect x="382" y="128" width="130" height="44" rx="8" class="bgR stR" stroke-width="1.5"/><text x="447.0" y="145.5" class="ink" font-size="11" text-anchor="middle">요청 1 → 실패</text><text x="447.0" y="162.5" class="ink" font-size="11" text-anchor="middle">(≤ request.timeout)</text><rect x="520" y="128" width="80" height="44" rx="8" class="bgN stN" stroke-width="1.5"/><text x="560.0" y="154.0" class="ink" font-size="11" text-anchor="middle">backoff</text><rect x="608" y="128" width="130" height="44" rx="8" class="bgG stG" stroke-width="1.5"/><text x="673.0" y="145.5" class="ink" font-size="11" text-anchor="middle">요청 2 → 성공</text><text x="673.0" y="162.5" class="ink" font-size="11" text-anchor="middle">(≤ request.timeout)</text><circle cx="760" cy="150" r="6" class="solG"/><text x="760" y="182" class="txG" font-size="12" text-anchor="middle" font-weight="600">결과 확정</text><text x="760" y="198" class="muted" font-size="11" text-anchor="middle">Future·콜백</text><path d="M40,110 L40,96 L240,96 L240,110" class="lnA" stroke-width="1.6"/><text x="140" y="88" class="txA" font-size="12" text-anchor="middle" font-weight="700">max.block.ms (기본 60초)</text><path d="M240,110 L240,76 L760,76 L760,110" class="lnB" stroke-width="1.6"/><text x="500" y="70" class="txB" font-size="12" text-anchor="middle" font-weight="700">delivery.timeout.ms (기본 2분)</text><rect x="24" y="222" width="400" height="64" rx="8" class="bgA stA" stroke-width="1.5"/><text x="224.0" y="249.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">호출 스레드가 멈춰 있다</text><text x="224.0" y="267.3" class="ink" font-size="12" text-anchor="middle">넘기면 send()가 실패한 Future를 반환</text><rect x="452" y="222" width="404" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="654.0" y="249.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">호출 스레드는 이미 다음 일을 한다</text><text x="654.0" y="267.3" class="ink" font-size="12" text-anchor="middle">넘기면 Future·콜백으로 실패 통보</text><text x="24" y="316" class="ink2" font-size="12" text-anchor="start">재시도는 delivery.timeout.ms 안에서만 일어난다. retries가 아무리 커도 2분이 지나면 끝난다.</text></svg>