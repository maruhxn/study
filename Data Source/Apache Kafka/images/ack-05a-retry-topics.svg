}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="390" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">재시도 토픽은 지연 간격마다 따로 생긴다</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">고정 간격이면 토픽 하나를 재사용하고, 지수 간격이면 지연 값마다 토픽이 생긴다</text><text x="24" y="84" class="ink" font-size="13" text-anchor="start" font-weight="700">고정 간격 (기본값, attempts=3)</text><rect x="24" y="98" width="150" height="60" rx="8" class="bgR stR" stroke-width="1.5"/><text x="99.0" y="123.2" class="ink" font-size="12" text-anchor="middle">orders</text><text x="99.0" y="141.2" class="ink" font-size="12" text-anchor="middle">시도 1</text><rect x="214" y="92" width="300" height="72" rx="8" class="bgN stN" stroke-width="1.5"/><text x="364" y="110" class="ink2" font-size="11" text-anchor="middle">orders-retry (한 토픽을 재사용)</text><rect x="230" y="120" width="130" height="36" rx="8" class="bgR stR" stroke-width="1.5"/><text x="295.0" y="142.2" class="ink" font-size="12" text-anchor="middle">시도 2 (1초 뒤)</text><rect x="368" y="120" width="130" height="36" rx="8" class="bgR stR" stroke-width="1.5"/><text x="433.0" y="142.2" class="ink" font-size="12" text-anchor="middle">시도 3 (1초 뒤)</text><rect x="554" y="98" width="150" height="60" rx="8" class="bgA stA" stroke-width="1.5"/><text x="629.0" y="123.2" class="ink" font-size="12" text-anchor="middle">orders-dlt</text><text x="629.0" y="141.2" class="ink" font-size="12" text-anchor="middle">@DltHandler</text><line x1="174" y1="128" x2="214" y2="128" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><line x1="514" y1="128" x2="554" y2="128" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><text x="24" y="210" class="ink" font-size="13" text-anchor="start" font-weight="700">지수 간격 (ex 1s · 2s · 4s, attempts=4)</text><rect x="24" y="226" width="142" height="62" rx="8" class="bgR stR" stroke-width="1.5"/><text x="95.0" y="250.8" class="ink" font-size="11" text-anchor="middle">orders</text><text x="95.0" y="270.9" class="ink" font-size="11" text-anchor="middle">시도 1</text><line x1="166" y1="257" x2="194" y2="257" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="194" y="226" width="142" height="62" rx="8" class="bgR stR" stroke-width="1.5"/><text x="265.0" y="250.8" class="ink" font-size="11" text-anchor="middle">orders-retry-1000</text><text x="265.0" y="270.9" class="ink" font-size="11" text-anchor="middle">시도 2 (1초 뒤)</text><line x1="336" y1="257" x2="364" y2="257" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="364" y="226" width="142" height="62" rx="8" class="bgR stR" stroke-width="1.5"/><text x="435.0" y="250.8" class="ink" font-size="11" text-anchor="middle">orders-retry-2000</text><text x="435.0" y="270.9" class="ink" font-size="11" text-anchor="middle">시도 3 (2초 뒤)</text><line x1="506" y1="257" x2="534" y2="257" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="534" y="226" width="142" height="62" rx="8" class="bgR stR" stroke-width="1.5"/><text x="605.0" y="250.8" class="ink" font-size="11" text-anchor="middle">orders-retry-4000</text><text x="605.0" y="270.9" class="ink" font-size="11" text-anchor="middle">시도 4 (4초 뒤)</text><line x1="676" y1="257" x2="704" y2="257" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="704" y="226" width="152" height="62" rx="8" class="bgA stA" stroke-width="1.5"/><text x="780.0" y="252.2" class="ink" font-size="12" text-anchor="middle">orders-dlt</text><text x="780.0" y="270.2" class="ink" font-size="12" text-anchor="middle">@DltHandler</text><rect x="24" y="322" width="832" height="44" rx="8" class="bgN stN" stroke-width="1.5"/><text x="440.0" y="348.6" class="ink" font-size="13" text-anchor="middle">attempts는 최초 시도를 포함한다. 기본 3이면 최초 1회 + 재시도 2회</text></svg>