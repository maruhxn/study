<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-label="고정 간격은 orders-retry 한 토픽을, 지수 간격은 retry-1000, 2000, 4000 토픽을 거쳐 DLT로 가는 두 흐름"><style>
