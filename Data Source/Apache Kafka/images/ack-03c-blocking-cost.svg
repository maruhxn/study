<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" width="880" height="408" role="img" aria-label="한 스레드가 backoff로 멈추면 같은 컨슈머가 맡은 다른 파티션의 레코드도 쌓여 lag가 늘어나는 모습"><style>
