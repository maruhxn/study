}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="408" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">블로킹 재시도 중에는 같은 컨슈머의 다른 파티션도 선다</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">컨슈머 하나가 P0, P1, P2를 맡고 있고 P0의 레코드가 재시도 대기 중인 상황</text><rect x="24" y="84" width="150" height="238" rx="8" class="bgA stA" stroke-width="1.5"/><text x="99.0" y="163.6" class="ink" font-size="13" text-anchor="middle">컨슈머</text><text x="99.0" y="185.6" class="ink" font-size="13" text-anchor="middle">스레드 1개</text><text x="99.0" y="207.6" class="ink" font-size="13" text-anchor="middle"></text><text x="99.0" y="229.6" class="ink" font-size="13" text-anchor="middle">backoff 대기 중</text><text x="99.0" y="251.6" class="ink" font-size="13" text-anchor="middle">(멈춰 있음)</text><rect x="240" y="84" width="616" height="70" rx="8" class="bgN stN" stroke-width="1.5"/><text x="256" y="110" class="ink mono" font-size="14" text-anchor="start" font-weight="700">P0</text><text x="256" y="132" class="txR" font-size="12" text-anchor="start" font-weight="600">실패한 레코드 재시도 대기</text><rect x="430" y="97" width="44" height="44" rx="7" class="bgR stR" stroke-width="1.5"/><text x="452.0" y="124.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">4</text><text x="470" y="109" class="txR" font-size="11" text-anchor="end" font-weight="700">✕</text><text x="484" y="124" class="ink2" font-size="12" text-anchor="start">다시 시도할 때까지 이 파티션도 앞으로 못 간다</text><line x1="174" y1="120" x2="240" y2="119" class="lnA" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mA)"/><rect x="240" y="166" width="616" height="70" rx="8" class="bgN stN" stroke-width="1.5"/><text x="256" y="192" class="ink mono" font-size="14" text-anchor="start" font-weight="700">P1</text><text x="256" y="214" class="ink2" font-size="12" text-anchor="start">읽지 못하고 쌓이는 중</text><rect x="430" y="180" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="449.0" y="204.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><rect x="476" y="180" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="495.0" y="204.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><rect x="522" y="180" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="541.0" y="204.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><rect x="568" y="180" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="587.0" y="204.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><rect x="614" y="180" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="633.0" y="204.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><rect x="660" y="180" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="679.0" y="204.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><rect x="706" y="180" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="725.0" y="204.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><text x="800" y="204" class="txR" font-size="13" text-anchor="middle" font-weight="700">lag ↑</text><line x1="174" y1="160" x2="240" y2="201" class="lnA" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mA)"/><rect x="240" y="248" width="616" height="70" rx="8" class="bgN stN" stroke-width="1.5"/><text x="256" y="274" class="ink mono" font-size="14" text-anchor="start" font-weight="700">P2</text><text x="256" y="296" class="ink2" font-size="12" text-anchor="start">읽지 못하고 쌓이는 중</text><rect x="430" y="262" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="449.0" y="286.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><rect x="476" y="262" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="495.0" y="286.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><rect x="522" y="262" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="541.0" y="286.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><rect x="568" y="262" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="587.0" y="286.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><rect x="614" y="262" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="633.0" y="286.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><rect x="660" y="262" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="679.0" y="286.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><rect x="706" y="262" width="38" height="38" rx="7" class="bgN stN" stroke-width="1.5"/><text x="725.0" y="286.04" class="ink" font-size="14" text-anchor="middle" font-weight="600"></text><text x="800" y="286" class="txR" font-size="13" text-anchor="middle" font-weight="700">lag ↑</text><line x1="174" y1="200" x2="240" y2="283" class="lnA" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mA)"/><rect x="24" y="336" width="832" height="46" rx="8" class="bgN stN" stroke-width="1.5"/><text x="440.0" y="363.6" class="ink" font-size="13" text-anchor="middle">대기가 max.poll.interval.ms(기본 5분)를 넘으면 컨슈머가 그룹에서 빠지고 리밸런싱이 일어난다</text></svg>