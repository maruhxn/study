<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" role="img" aria-label="처리 후 오프셋 커밋 전에 프로세스가 죽거나, 리밸런싱으로 파티션이 다른 컨슈머로 넘어가면 마지막 커밋 오프셋부터 같은 레코드가 다시 오는 두 경우"><style>
