  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="370" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">같은 레코드가 다시 오는 두 가지 경우</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">둘 다 버그가 아니라 at-least-once의 정상 동작이다</text><text x="24" y="92" class="ink" font-size="13" text-anchor="start" font-weight="700">장애: 처리는 끝났는데 커밋 전에 죽었다</text><rect x="24" y="104" width="186" height="56" rx="8" class="bgG stG" stroke-width="1.5"/><text x="117.0" y="127.3" class="ink" font-size="12" text-anchor="middle">43 처리</text><text x="117.0" y="145.3" class="ink" font-size="12" text-anchor="middle">DB 커밋 완료</text><line x1="210" y1="132" x2="236" y2="132" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="238" y="104" width="186" height="56" rx="8" class="bgR stR" stroke-width="1.5"/><text x="331.0" y="127.3" class="ink" font-size="12" text-anchor="middle">오프셋 커밋 전</text><text x="331.0" y="145.3" class="ink" font-size="12" text-anchor="middle">프로세스 종료</text><line x1="424" y1="132" x2="450" y2="132" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="452" y="104" width="186" height="56" rx="8" class="bgN stN" stroke-width="1.5"/><text x="545.0" y="127.3" class="ink" font-size="12" text-anchor="middle">재시작</text><text x="545.0" y="145.3" class="ink" font-size="12" text-anchor="middle">커밋 오프셋 43부터</text><line x1="638" y1="132" x2="664" y2="132" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="666" y="104" width="186" height="56" rx="8" class="bgR stR" stroke-width="1.5"/><text x="759.0" y="127.3" class="ink" font-size="12" text-anchor="middle">43을 또 처리</text><text x="759.0" y="145.3" class="ink" font-size="12" text-anchor="middle">결제가 두 번?</text><rect x="24" y="220" width="186" height="56" rx="8" class="bgB stB" stroke-width="1.5"/><text x="117.0" y="243.3" class="ink" font-size="12" text-anchor="middle">컨슈머 A가 P0의</text><text x="117.0" y="261.3" class="ink" font-size="12" text-anchor="middle">43~45 처리 중</text><line x1="210" y1="248" x2="236" y2="248" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="238" y="220" width="186" height="56" rx="8" class="bgA stA" stroke-width="1.5"/><text x="331.0" y="243.3" class="ink" font-size="12" text-anchor="middle">A가 그룹에서 빠짐</text><text x="331.0" y="261.3" class="ink" font-size="12" text-anchor="middle">배포 · poll 간격 초과</text><line x1="424" y1="248" x2="450" y2="248" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="452" y="220" width="186" height="56" rx="8" class="bgN stN" stroke-width="1.5"/><text x="545.0" y="243.3" class="ink" font-size="12" text-anchor="middle">P0를 컨슈머 B에</text><text x="545.0" y="261.3" class="ink" font-size="12" text-anchor="middle">재할당</text><line x1="638" y1="248" x2="664" y2="248" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="666" y="220" width="186" height="56" rx="8" class="bgR stR" stroke-width="1.5"/><text x="759.0" y="243.3" class="ink" font-size="12" text-anchor="middle">B는 43부터 읽음</text><text x="759.0" y="261.3" class="ink" font-size="12" text-anchor="middle">43~45 중복 처리</text><text x="24" y="208" class="ink" font-size="13" text-anchor="start" font-weight="700">리밸런싱: 파티션 담당자가 바뀌었다</text><rect x="24" y="300" width="832" height="50" rx="8" class="bgG stG" stroke-width="1.5"/><text x="440.0" y="329.7" class="ink" font-size="13" text-anchor="middle">중복은 막을 수 없다. 대신 두 번 처리해도 결과가 같게 만든다 (멱등 처리)</text></svg>