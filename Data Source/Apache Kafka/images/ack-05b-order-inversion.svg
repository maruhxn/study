.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="460" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">@RetryableTopic을 쓸 수 없는 경우: 순서가 중요한 흐름</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">실패한 이벤트가 재시도 토픽으로 빠지는 사이 원본 토픽의 다음 이벤트가 먼저 처리된다</text><text x="24" y="84" class="ink2" font-size="12" text-anchor="start">같은 키 O1의 이벤트 두 개: OrderCreated(O1), 그 직후 OrderCancelled(O1)</text><text x="24" y="130" class="ink mono" font-size="13" text-anchor="start" font-weight="700">orders (원본)</text><rect x="24" y="142" width="832" height="64" rx="8" class="bgN stN" stroke-width="1.5"/><text x="24" y="262" class="ink mono" font-size="13" text-anchor="start" font-weight="700">orders-retry</text><rect x="24" y="274" width="832" height="64" rx="8" class="bgN stN" stroke-width="1.5"/><rect x="60" y="152" width="190" height="44" rx="8" class="bgR stR" stroke-width="1.5"/><text x="155.0" y="169.6" class="ink" font-size="11" text-anchor="middle">OrderCreated(O1)</text><text x="155.0" y="186.1" class="ink" font-size="11" text-anchor="middle">처리 실패</text><path d="M155,198 C155,240 155,250 330,282" class="lnB" stroke-width="1.6" marker-end="url(#mB)"/><text x="215" y="240" class="txB" font-size="12" text-anchor="start" font-weight="600">재시도 토픽으로 발행</text><rect x="330" y="152" width="190" height="44" rx="8" class="bgG stG" stroke-width="1.5"/><text x="425.0" y="169.6" class="ink" font-size="11" text-anchor="middle">OrderCancelled(O1)</text><text x="425.0" y="186.1" class="ink" font-size="11" text-anchor="middle">① 먼저 처리됨</text><text x="570" y="168" class="ink2" font-size="12" text-anchor="start">원본은 계속 소비하니까</text><text x="570" y="186" class="ink2" font-size="12" text-anchor="start">뒤의 이벤트가 앞질러 간다</text><rect x="330" y="284" width="120" height="44" rx="8" class="bgA stA" stroke-width="1.5"/><text x="390" y="311" class="txA" font-size="12" text-anchor="middle" font-weight="600">대기 (1초)</text><rect x="470" y="284" width="190" height="44" rx="8" class="bgG stG" stroke-width="1.5"/><text x="565.0" y="301.6" class="ink" font-size="11" text-anchor="middle">OrderCreated(O1)</text><text x="565.0" y="318.1" class="ink" font-size="11" text-anchor="middle">② 나중에 처리됨</text><rect x="24" y="360" width="832" height="52" rx="8" class="bgR stR" stroke-width="1.5"/><text x="440.0" y="390.6" class="ink" font-size="13" text-anchor="middle" font-weight="600">취소(①)가 먼저, 생성(②)이 나중에 처리돼 같은 키의 순서가 깨진다</text><text x="24" y="434" class="muted" font-size="12" text-anchor="start">공식 문서도 이 방식은 토픽의 순서 보장을 잃는다고 적는다</text></svg>