<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-label="OrderCreated가 재시도 토픽으로 가는 동안 OrderCancelled가 먼저 처리되어 순서가 뒤바뀌는 모습"><style>
