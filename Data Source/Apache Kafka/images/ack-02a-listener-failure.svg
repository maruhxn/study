 text-anchor="middle" font-weight="600">6</text><text x="399" y="78" class="txR" font-size="12" text-anchor="middle" font-weight="600">예외 발생</text><text x="279" y="154" class="txG" font-size="12" text-anchor="middle" font-weight="600">커밋됨</text><path d="M519,228 C519,252 399,252 399,238" class="lnB" stroke-width="1.6" marker-end="url(#mB)"/><text x="459" y="270" class="txB" font-size="12" text-anchor="middle" font-weight="600">seek(4번째)</text><text x="279" y="346" class="muted" font-size="11" text-anchor="middle">이미 커밋돼 다시 오지 않음</text><rect x="580" y="90" width="276" height="78" rx="8" class="bgA stA" stroke-width="1.5"/><text x="718.0" y="123.8" class="ink" font-size="13" text-anchor="middle">실패 지점 이후는 커밋되지 않는다</text><text x="718.0" y="143.3" class="ink" font-size="13" text-anchor="middle">그래서 4·5·6번이 다시 전달된다</text><rect x="580" y="292" width="276" height="78" rx="8" class="bgG stG" stroke-width="1.5"/><text x="718.0" y="326.2" class="ink" font-size="12" text-anchor="middle">재시도를 소진하고 복구(recover)하면</text><text x="718.0" y="344.2" class="ink" font-size="12" text-anchor="middle">실패 레코드까지 커밋 (ackAfterHandle)</text></svg>