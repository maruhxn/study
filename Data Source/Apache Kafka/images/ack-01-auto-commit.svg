<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="auto commit이 켜져 있으면 처리 중 종료 시 42~45가 유실되고, 컨테이너 커밋이면 42부터 다시 받는 모습"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="430" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">처리 중에 죽으면 레코드는 어디까지 살아남을까</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">레코드 40~45를 poll()로 받고 42번을 처리하다 프로세스가 죽은 상황</text><text x="24" y="84" class="txA mono" font-size="14" text-anchor="start" font-weight="700">enable.auto.commit = true</text><text x="24" y="102" class="ink2" font-size="12" text-anchor="start">클라이언트가 처리 완료와 무관하게 주기적으로 커밋한다</text><rect x="24" y="122" width="46" height="46" rx="7" class="bgG stG" stroke-width="1.5"/><text x="47.0" y="150.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">40</text><text x="66" y="134" class="txG" font-size="11" text-anchor="end" font-weight="700">✓</text><rect x="80" y="122" width="46" height="46" rx="7" class="bgG stG" stroke-width="1.5"/><text x="103.0" y="150.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">41</text><text x="122" y="134" class="txG" font-size="11" text-anchor="end" font-weight="700">✓</text><rect x="136" y="122" width="46" height="46" rx="7" class="bgB stB" stroke-width="1.5"/><text x="159.0" y="150.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">42</text><rect x="192" y="122" width="46" height="46" rx="7" class="bgN stN" stroke-width="1.5"/><text x="215.0" y="150.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">43</text><rect x="248" y="122" width="46" height="46" rx="7" class="bgN stN" stroke-width="1.5"/><text x="271.0" y="150.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">44</text><rect x="304" y="122" width="46" height="46" rx="7" class="bgN stN" stroke-width="1.5"/><text x="327.0" y="150.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">45</text><text x="140" y="198" class="txR" font-size="12" text-anchor="start" font-weight="600">42번 처리 중 프로세스 종료</text><line x1="354" y1="116" x2="354" y2="186" class="lnR" stroke-width="2"/><polygon points="354,188 348,199 360,199" class="solR"/><text x="24" y="224" class="ink2" font-size="12" text-anchor="start">auto.commit.interval.ms가 지나 poll()이 돌려준 끝 위치(46)가 커밋된다</text><rect x="470" y="112" width="386" height="84" rx="8" class="bgR stR" stroke-width="1.5"/><text x="663.0" y="148.8" class="ink" font-size="13" text-anchor="middle">재시작하면 46번부터 읽는다</text><text x="663.0" y="168.3" class="ink" font-size="13" text-anchor="middle">처리하지 못한 42~45는 다시 오지 않는다 (유실)</text><line x1="24" y1="238" x2="856" y2="238" class="lnN" stroke-width="1.4" stroke-dasharray="4 4"/><text x="24" y="272" class="txG mono" font-size="14" text-anchor="start" font-weight="700">enable.auto.commit = false + AckMode</text><text x="24" y="290" class="ink2" font-size="12" text-anchor="start">리스너 컨테이너가 처리를 끝낸 레코드까지만 커밋한다</text><rect x="24" y="310" width="46" height="46" rx="7" class="bgG stG" stroke-width="1.5"/><text x="47.0" y="338.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">40</text><text x="66" y="322" class="txG" font-size="11" text-anchor="end" font-weight="700">✓</text><rect x="80" y="310" width="46" height="46" rx="7" class="bgG stG" stroke-width="1.5"/><text x="103.0" y="338.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">41</text><text x="122" y="322" class="txG" font-size="11" text-anchor="end" font-weight="700">✓</text><rect x="136" y="310" width="46" height="46" rx="7" class="bgB stB" stroke-width="1.5"/><text x="159.0" y="338.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">42</text><rect x="192" y="310" width="46" height="46" rx="7" class="bgN stN" stroke-width="1.5"/><text x="215.0" y="338.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">43</text><rect x="248" y="310" width="46" height="46" rx="7" class="bgN stN" stroke-width="1.5"/><text x="271.0" y="338.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">44</text><rect x="304" y="310" width="46" height="46" rx="7" class="bgN stN" stroke-width="1.5"/><text x="327.0" y="338.04" class="ink" font-size="14" text-anchor="middle" font-weight="600">45</text><text x="140" y="374" class="txR" font-size="12" text-anchor="start" font-weight="600">42번 처리 중 프로세스 종료</text><line x1="131" y1="304" x2="131" y2="374" class="lnG" stroke-width="2"/><polygon points="131,376 125,387 137,387" class="solG"/><text x="24" y="402" class="ink2" font-size="12" text-anchor="start">커밋 위치 42: 40·41까지 처리가 끝난 곳</text><rect x="470" y="300" width="386" height="84" rx="8" class="bgG stG" stroke-width="1.5"/><text x="663.0" y="336.8" class="ink" font-size="13" text-anchor="middle">재시작하면 42번부터 다시 받는다</text><text x="663.0" y="356.3" class="ink" font-size="13" text-anchor="middle">처리하지 못한 레코드는 한 건도 빠지지 않는다</text></svg>