xt x="40" y="185" class="ink" font-size="13" text-anchor="start" font-weight="600">파티션 1</text><rect x="450" y="156" width="230" height="46" rx="8" class="bgN stN" stroke-width="1.5"/><text x="466" y="185" class="ink" font-size="13" text-anchor="start" font-weight="600">파티션 1</text><rect x="24" y="214" width="230" height="46" rx="8" class="bgN stN" stroke-width="1.5"/><text x="40" y="243" class="ink" font-size="13" text-anchor="start" font-weight="600">파티션 2</text><rect x="450" y="214" width="230" height="46" rx="8" class="bgN stN" stroke-width="1.5"/><text x="466" y="243" class="ink" font-size="13" text-anchor="start" font-weight="600">파티션 2</text><rect x="176" y="214" width="42" height="42" rx="7" class="bgR stR" stroke-width="1.5"/><text x="197.0" y="239.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">57</text><text x="214" y="226" class="txR" font-size="11" text-anchor="end" font-weight="700">✕</text><text x="380" y="206" class="txB" font-size="12" text-anchor="middle" font-weight="600">같은 번호 파티션</text><line x1="256" y1="233" x2="448" y2="233" class="lnB" stroke-width="1.6" marker-end="url(#mB)"/><rect x="594" y="214" width="42" height="42" rx="7" class="bgA stA" stroke-width="1.5"/><text x="615.0" y="239.68" class="ink" font-size="13" text-anchor="middle" font-weight="600">57</text><rect x="700" y="98" width="156" height="160" rx="8" class="bgA stA" stroke-width="1.5"/><text x="778.0" y="129.3" class="ink" font-size="11" text-anchor="middle">붙는 헤더</text><text x="778.0" y="150.3" class="ink" font-size="11" text-anchor="middle">original-topic</text><text x="778.0" y="171.3" class="ink" font-size="11" text-anchor="middle">original-partition</text><text x="778.0" y="192.3" class="ink" font-size="11" text-anchor="middle">original-offset</text><text x="778.0" y="213.3" class="ink" font-size="11" text-anchor="middle">original-timestamp</text><text x="778.0" y="234.3" class="ink" font-size="11" text-anchor="middle">그룹·예외 정보</text><rect x="24" y="290" width="410" height="80" rx="8" class="bgA stA" stroke-width="1.5"/><text x="40" y="316" class="ink" font-size="13" text-anchor="start" font-weight="600">기본 resolver는 같은 번호로 보낸다</text><text x="40" y="338" class="ink2" font-size="12" text-anchor="start"><tspan x="40" dy="0">DLT 파티션 수는 원본 이상이어야 한다</tspan><tspan x="40" dy="18.0">줄이려면 파티션을 -1로 돌려 Kafka 파티셔너에 맡긴다</tspan></text><rect x="446" y="290" width="410" height="80" rx="8" class="bgR stR" stroke-width="1.5"/><text x="462" y="316" class="ink" font-size="13" text-anchor="start" font-weight="600">DLT 발행이 실패하면</text><text x="462" y="338" class="ink2" font-size="12" text-anchor="start"><tspan x="462" dy="0">실패 레코드를 다시 seek하고 BackOff를 초기화해</tspan><tspan x="462" dy="18.0">재시도부터 다시 한다. DLT에 중복 발행될 수 있다</tspan></text></svg>