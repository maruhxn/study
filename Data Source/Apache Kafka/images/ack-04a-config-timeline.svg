</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="410" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">설정 예시대로 동작하면 DLT까지 7초가 걸린다</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">최초 1회 + 재시도 3회, 대기 합계 7초 뒤 DLT. 파싱·검증 오류는 재시도하지 않는다</text><text x="24" y="82" class="ink2 mono" font-size="12" text-anchor="start">ExponentialBackOffWithMaxRetries(3), 1s → 2s → 4s</text><text x="24" y="106" class="ink" font-size="13" text-anchor="start" font-weight="700">일시적 오류</text><line x1="70" y1="189" x2="735" y2="189" class="lnN" stroke-width="2"/><rect x="73" y="176" width="89" height="26" rx="4" class="bgA stA" stroke-width="1.5"/><text x="117.5" y="194" class="txA" font-size="12" text-anchor="middle" font-weight="600">대기 1s</text><rect x="168" y="176" width="184" height="26" rx="4" class="bgA stA" stroke-width="1.5"/><text x="260.0" y="194" class="txA" font-size="12" text-anchor="middle" font-weight="600">대기 2s</text><rect x="358" y="176" width="374" height="26" rx="4" class="bgA stA" stroke-width="1.5"/><text x="545.0" y="194" class="txA" font-size="12" text-anchor="middle" font-weight="600">대기 4s</text><rect x="53" y="150" width="34" height="34" rx="7" class="bgR stR" stroke-width="1.5"/><text x="70" y="172" class="txR" font-size="15" text-anchor="middle" font-weight="700">✕</text><text x="70" y="142" class="ink2" font-size="12" text-anchor="middle">최초</text><text x="70" y="222" class="muted" font-size="11" text-anchor="middle">0s</text><rect x="148" y="150" width="34" height="34" rx="7" class="bgR stR" stroke-width="1.5"/><text x="165" y="172" class="txR" font-size="15" text-anchor="middle" font-weight="700">✕</text><text x="165" y="142" class="ink2" font-size="12" text-anchor="middle">재시도 1</text><text x="165" y="222" class="muted" font-size="11" text-anchor="middle">1s</text><rect x="338" y="150" width="34" height="34" rx="7" class="bgR stR" stroke-width="1.5"/><text x="355" y="172" class="txR" font-size="15" text-anchor="middle" font-weight="700">✕</text><text x="355" y="142" class="ink2" font-size="12" text-anchor="middle">재시도 2</text><text x="355" y="222" class="muted" font-size="11" text-anchor="middle">3s</text><rect x="718" y="150" width="34" height="34" rx="7" class="bgR stR" stroke-width="1.5"/><text x="735" y="172" class="txR" font-size="15" text-anchor="middle" font-weight="700">✕</text><text x="735" y="142" class="ink2" font-size="12" text-anchor="middle">재시도 3</text><text x="735" y="222" class="muted" font-size="11" text-anchor="middle">7s</text><rect x="764" y="156" width="92" height="66" rx="8" class="bgR stR" stroke-width="1.5"/><text x="810.0" y="184.2" class="ink" font-size="12" text-anchor="middle">orders-dlt</text><text x="810.0" y="202.2" class="ink" font-size="12" text-anchor="middle">7초 뒤</text><line x1="755" y1="189" x2="762" y2="189" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><text x="24" y="262" class="ink" font-size="13" text-anchor="start" font-weight="700">파싱·검증 오류</text><rect x="53" y="294" width="34" height="34" rx="7" class="bgR stR" stroke-width="1.5"/><text x="70" y="316" class="txR" font-size="15" text-anchor="middle" font-weight="700">✕</text><text x="70" y="286" class="ink2" font-size="12" text-anchor="middle">최초</text><line x1="92" y1="312" x2="760" y2="312" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><text x="420" y="304" class="txR" font-size="12" text-anchor="middle" font-weight="600">재시도 없이 바로 recoverer</text><rect x="764" y="288" width="92" height="48" rx="8" class="bgR stR" stroke-width="1.5"/><text x="810.0" y="307.2" class="ink" font-size="12" text-anchor="middle">orders-dlt</text><text x="810.0" y="325.2" class="ink" font-size="12" text-anchor="middle">바로</text><rect x="24" y="346" width="832" height="40" rx="8" class="bgN stN" stroke-width="1.5"/><text x="440.0" y="370.6" class="ink" font-size="13" text-anchor="middle">대기 7초 동안 이 컨슈머가 맡은 다른 파티션도 함께 멈춘다</text></svg>