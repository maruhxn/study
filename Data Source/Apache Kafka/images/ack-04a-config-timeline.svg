<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="일시적 오류는 1초 2초 4초 대기 뒤 7초 시점에 DLT로 가고 파싱 오류는 바로 DLT로 가는 두 타임라인"><style>
