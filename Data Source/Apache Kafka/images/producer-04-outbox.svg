<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="직접 발행은 버퍼에 있던 이벤트가 프로세스 종료로 사라지지만, Outbox는 DB에 남은 행을 재시작 후 다시 보내 유실을 막고 대신 중복이 생길 수 있음을 비교"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="320" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">버퍼에 있던 이벤트가 프로세스와 함께 사라질 때</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">주문 저장 직후 프로세스가 강제 종료된 경우</text><text x="24" y="92" class="ink" font-size="13" text-anchor="start" font-weight="700">직접 발행</text><rect x="24" y="104" width="170" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="109.0" y="125.3" class="ink" font-size="12" text-anchor="middle">DB 커밋</text><text x="109.0" y="143.3" class="ink" font-size="12" text-anchor="middle">주문 저장됨</text><rect x="222" y="104" width="170" height="52" rx="8" class="bgA stA" stroke-width="1.5"/><text x="307.0" y="125.3" class="ink" font-size="12" text-anchor="middle">send()</text><text x="307.0" y="143.3" class="ink" font-size="12" text-anchor="middle">이벤트는 버퍼(메모리)</text><rect x="420" y="104" width="150" height="52" rx="8" class="bgR stR" stroke-width="1.5"/><text x="495.0" y="125.3" class="ink" font-size="12" text-anchor="middle">프로세스 종료</text><text x="495.0" y="143.3" class="ink" font-size="12" text-anchor="middle">버퍼 소멸</text><rect x="598" y="104" width="258" height="52" rx="8" class="bgR stR" stroke-width="1.5"/><text x="727.0" y="125.3" class="ink" font-size="12" text-anchor="middle">주문은 있는데 이벤트는 영영 없다</text><text x="727.0" y="143.3" class="ink" font-size="12" text-anchor="middle">다시 보낼 근거가 남지 않음</text><line x1="194" y1="130" x2="220" y2="130" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="392" y1="130" x2="418" y2="130" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><line x1="570" y1="130" x2="596" y2="130" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><text x="24" y="200" class="ink" font-size="13" text-anchor="start" font-weight="700">Transactional Outbox</text><rect x="24" y="212" width="170" height="52" rx="8" class="bgG stG" stroke-width="1.5"/><text x="109.0" y="233.3" class="ink" font-size="12" text-anchor="middle">한 DB 트랜잭션</text><text x="109.0" y="251.3" class="ink" font-size="12" text-anchor="middle">주문 + outbox 행</text><rect x="222" y="212" width="170" height="52" rx="8" class="bgA stA" stroke-width="1.5"/><text x="307.0" y="233.3" class="ink" font-size="12" text-anchor="middle">전달자가 행을 읽어</text><text x="307.0" y="251.3" class="ink" font-size="12" text-anchor="middle">send()</text><rect x="420" y="212" width="150" height="52" rx="8" class="bgR stR" stroke-width="1.5"/><text x="495.0" y="233.3" class="ink" font-size="12" text-anchor="middle">프로세스 종료</text><text x="495.0" y="251.3" class="ink" font-size="12" text-anchor="middle">버퍼 소멸</text><rect x="598" y="212" width="258" height="52" rx="8" class="bgG stG" stroke-width="1.5"/><text x="727.0" y="233.3" class="ink" font-size="12" text-anchor="middle">재시작 후 미발행 행을 다시 send()</text><text x="727.0" y="251.3" class="ink" font-size="12" text-anchor="middle">유실 없음 · 대신 중복 가능</text><line x1="194" y1="238" x2="220" y2="238" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="392" y1="238" x2="418" y2="238" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><line x1="570" y1="238" x2="596" y2="238" class="lnG" stroke-width="1.6" marker-end="url(#mG)"/><text x="24" y="300" class="ink2" font-size="12" text-anchor="start">Outbox는 '보낼 이벤트'를 메모리가 아닌 DB에 남긴다. 성공 응답을 받은 뒤에야 발행 완료로 표시한다.</text></svg>