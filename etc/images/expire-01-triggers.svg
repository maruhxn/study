<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="네 가지 정리 방식이 만료 시각 이후 언제 정리를 실행하는지 비교한 타임라인"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="380" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">정리 방식마다 정리가 일어나는 시각이 다르다</text><line x1="330" y1="56" x2="330" y2="340" class="lnR" stroke-width="1.6" stroke-dasharray="5 4"/><text x="330" y="52" class="txR" font-size="12" text-anchor="middle" font-weight="600">만료 시각</text><rect x="24" y="74" width="190" height="44" rx="8" class="bgN stN" stroke-width="1.5"/><text x="119.0" y="98.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">① 요청 시 정리</text><line x1="230" y1="96" x2="856" y2="96" class="lnN" stroke-width="2"/><rect x="24" y="144" width="190" height="44" rx="8" class="bgN stN" stroke-width="1.5"/><text x="119.0" y="168.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">② 주기 스캔</text><line x1="230" y1="166" x2="856" y2="166" class="lnN" stroke-width="2"/><rect x="24" y="214" width="190" height="44" rx="8" class="bgN stN" stroke-width="1.5"/><text x="119.0" y="238.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">③ 건별 타이머</text><line x1="230" y1="236" x2="856" y2="236" class="lnN" stroke-width="2"/><rect x="24" y="284" width="190" height="44" rx="8" class="bgN stN" stroke-width="1.5"/><text x="119.0" y="308.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">④ 저장소 TTL</text><line x1="230" y1="306" x2="856" y2="306" class="lnN" stroke-width="2"/><line x1="330" y1="96" x2="640" y2="96" class="lnA" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="640" cy="96" r="5" class="solG"/><text x="650" y="88" class="txG" font-size="12" text-anchor="start">다음 요청이 왔을 때</text><text x="650" y="116" class="txR" font-size="12" text-anchor="start">안 오면 영원히 안 함</text><line x1="270" y1="158" x2="270" y2="174" class="lnI" stroke-width="1.4"/><line x1="410" y1="158" x2="410" y2="174" class="lnI" stroke-width="1.4"/><line x1="550" y1="158" x2="550" y2="174" class="lnI" stroke-width="1.4"/><line x1="690" y1="158" x2="690" y2="174" class="lnI" stroke-width="1.4"/><line x1="830" y1="158" x2="830" y2="174" class="lnI" stroke-width="1.4"/><circle cx="410" cy="166" r="5" class="solG"/><text x="420" y="156" class="txG" font-size="12" text-anchor="start">다음 주기에 (최대 한 주기 늦음)</text><circle cx="330" cy="236" r="5" class="solG"/><text x="342" y="228" class="txG" font-size="12" text-anchor="start">만료 시각에 바로</text><text x="342" y="256" class="txR" font-size="12" text-anchor="start">예약이 등록되지 않았거나 사라지면 안 함</text><rect x="350" y="296" width="420" height="20" class="bgA"/><text x="560" y="290" class="txA" font-size="12" text-anchor="middle">몇 초에서 며칠 사이 언젠가 삭제</text><text x="560" y="334" class="muted" font-size="12" text-anchor="middle">기한에 맞춘 후속 작업은 어렵다</text></svg>
