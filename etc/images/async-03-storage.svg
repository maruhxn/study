<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" role="img" aria-label="뺀 작업을 메모리, 브로커, 업무 DB 중 어디에 두느냐에 따라 프로세스가 죽었을 때 남는지, 다시 전달되는지, 업무 데이터와 같은 트랜잭션인지가 갈린다"><style>
