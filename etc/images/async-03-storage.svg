</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="344" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="700">뺀 작업을 어디에 두느냐가 유실과 중복을 정한다</text><rect x="190" y="52" width="218" height="50" rx="8" class="bgN stN" stroke-width="1.5"/><text x="299.0" y="73" class="ink" font-size="13" text-anchor="middle" font-weight="700">메모리</text><text x="299.0" y="91" class="ink2" font-size="11" text-anchor="middle">@Async 큐 · 스레드 풀</text><rect x="412" y="52" width="218" height="50" rx="8" class="bgB stB" stroke-width="1.5"/><text x="521.0" y="73" class="ink" font-size="13" text-anchor="middle" font-weight="700">브로커 (메시지 큐)</text><text x="521.0" y="91" class="ink2" font-size="11" text-anchor="middle">Kafka · RabbitMQ · SQS</text><rect x="634" y="52" width="218" height="50" rx="8" class="bgG stG" stroke-width="1.5"/><text x="743.0" y="73" class="ink" font-size="13" text-anchor="middle" font-weight="700">업무 DB</text><text x="743.0" y="91" class="ink2" font-size="11" text-anchor="middle">outbox · Task Queue · 원본</text><rect x="24" y="112" width="160" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="36" y="138" class="ink" font-size="12" text-anchor="start" font-weight="700">프로세스가 죽으면</text><rect x="190" y="112" width="218" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="299.0" y="138" class="txR" font-size="12" text-anchor="middle">사라진다</text><rect x="412" y="112" width="218" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="521.0" y="138" class="txA" font-size="12" text-anchor="middle">남는다 (전송이 끝난 뒤부터)</text><rect x="634" y="112" width="218" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="743.0" y="138" class="txG" font-size="12" text-anchor="middle">남는다 (커밋되면)</text><rect x="24" y="160" width="160" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="36" y="186" class="ink" font-size="12" text-anchor="start" font-weight="700">처리가 실패하면</text><rect x="190" y="160" width="218" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="299.0" y="186" class="txR" font-size="12" text-anchor="middle">다시 줄 근거가 없다</text><rect x="412" y="160" width="218" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="521.0" y="186" class="ink" font-size="12" text-anchor="middle">브로커가 다시 전달한다</text><rect x="634" y="160" width="218" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="743.0" y="186" class="ink" font-size="12" text-anchor="middle">다시 읽어 처리한다</text><rect x="24" y="208" width="160" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="36" y="234" class="ink" font-size="12" text-anchor="start" font-weight="700">기본 전달 보장</text><rect x="190" y="208" width="218" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="299.0" y="234" class="ink" font-size="12" text-anchor="middle">최대 한 번 (at-most-once)</text><rect x="412" y="208" width="218" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="521.0" y="234" class="ink" font-size="12" text-anchor="middle">적어도 한 번 (at-least-once)</text><rect x="634" y="208" width="218" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="743.0" y="234" class="ink" font-size="12" text-anchor="middle">적어도 한 번 (at-least-once)</text><rect x="24" y="256" width="160" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="36" y="282" class="ink" font-size="12" text-anchor="start" font-weight="700">업무 DB와 한 트랜잭션</text><rect x="190" y="256" width="218" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="299.0" y="282" class="ink2" font-size="12" text-anchor="middle">아니다</text><rect x="412" y="256" width="218" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="521.0" y="282" class="txR" font-size="12" text-anchor="middle">아니다 → 이중 쓰기 (4.3)</text><rect x="634" y="256" width="218" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="743.0" y="282" class="txG" font-size="12" text-anchor="middle">같다</text><text x="24" y="326" class="ink2" font-size="12" text-anchor="start">이 글에서 "메시지 큐"는 브로커를 가리킨다. 메모리 큐도 큐지만, 프로세스 안에 있어서 성질이 다르다.</text></svg>
