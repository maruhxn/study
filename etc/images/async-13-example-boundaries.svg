<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="주문 트랜잭션은 주문과 outbox 행을 함께 커밋하고 알림은 커밋 뒤 메모리 큐로 간다. 릴레이가 outbox를 읽어 Kafka로 보내고, 포인트 트랜잭션은 처리 이력과 적립을 함께 커밋한 뒤 오프셋을 커밋한다. 번호는 장애 시점이다"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.lnW { stroke: #ffffff; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="420" rx="8"/><text x="24.0" y="32.0" class="ink" font-size="16" text-anchor="start" font-weight="600">주문 트랜잭션과 포인트 트랜잭션, 그 사이의 at-least-once</text><rect x="24" y="70" width="300" height="148" rx="8" class="stG" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/><text x="36.0" y="90.0" class="txG" font-size="12" text-anchor="start" font-weight="700">주문 트랜잭션 (DB)</text><rect x="40" y="102" width="268" height="44" rx="8" class="bgN stN" stroke-width="1.5"/><text x="174.0" y="128.3" class="ink mono" font-size="12" text-anchor="middle" font-weight="600">INSERT orders</text><rect x="40" y="158" width="268" height="44" rx="8" class="bgG stG" stroke-width="1.5"/><text x="174.0" y="184.3" class="ink mono" font-size="12" text-anchor="middle" font-weight="600">INSERT outbox</text><circle cx="314" cy="80" r="10" class="solR"/><text x="314.0" y="84.0" class="wh" font-size="12" text-anchor="middle" font-weight="700">1</text><line x1="324" y1="107" x2="378" y2="107" class="lnA" stroke-width="1.6" marker-end="url(#mA)"/><text x="351.0" y="99.0" class="txA" font-size="11" text-anchor="middle" font-weight="700">커밋 뒤</text><rect x="380" y="84" width="180" height="46" rx="8" class="bgA stA" stroke-width="1.5"/><text x="470.0" y="102.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">알림 작업</text><text x="470.0" y="120.0" class="ink2 mono" font-size="11" text-anchor="middle">@Async 메모리 큐</text><circle cx="552" cy="84" r="10" class="solR"/><text x="552.0" y="88.0" class="wh" font-size="12" text-anchor="middle" font-weight="700">2</text><line x1="560" y1="107" x2="618" y2="107" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="620" y="84" width="236" height="46" rx="8" class="bgN stN" stroke-width="1.5"/><text x="738.0" y="111.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">푸시 서버</text><line x1="308" y1="180" x2="378" y2="189" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="380" y="166" width="180" height="46" rx="8" class="bgN stN" stroke-width="1.5"/><text x="470.0" y="184.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">릴레이</text><text x="470.0" y="202.0" class="ink2" font-size="11" text-anchor="middle">0.5초마다 outbox 조회</text><line x1="560" y1="189" x2="618" y2="189" class="lnB" stroke-width="1.6" marker-end="url(#mB)"/><text x="589.0" y="181.0" class="txB" font-size="10" text-anchor="middle" font-weight="700">전송·ack</text><circle cx="390" cy="166" r="10" class="solR"/><text x="390.0" y="170.0" class="wh" font-size="12" text-anchor="middle" font-weight="700">3</text><text x="384.0" y="230.0" class="muted mono" font-size="10" text-anchor="start">ack 뒤 sent_at UPDATE</text><rect x="620" y="166" width="236" height="46" rx="8" class="bgB stB" stroke-width="1.5"/><text x="738.0" y="184.3" class="ink mono" font-size="12" text-anchor="middle" font-weight="600">Kafka orders.placed</text><text x="738.0" y="202.0" class="ink2" font-size="11" text-anchor="middle">키 = 주문 ID</text><path d="M738,212 L738,240 L420,240 L420,262" class="lnB" stroke-width="1.6" marker-end="url(#mB)"/><text x="748.0" y="230.0" class="txB" font-size="11" text-anchor="start" font-weight="700">컨슈머가 받는다</text><text x="748.0" y="256.0" class="txB" font-size="11" text-anchor="start" font-weight="700">(at-least-once)</text><rect x="200" y="264" width="440" height="104" rx="8" class="stG" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/><text x="212.0" y="284.0" class="txG" font-size="12" text-anchor="start" font-weight="700">포인트 트랜잭션 (DB)</text><rect x="216" y="296" width="202" height="56" rx="8" class="bgG stG" stroke-width="1.5"/><text x="317.0" y="319.3" class="ink mono" font-size="12" text-anchor="middle" font-weight="600">processed_message</text><text x="317.0" y="337.0" class="ink2" font-size="11" text-anchor="middle">UNIQUE, 충돌이면 건너뜀</text><line x1="418" y1="324" x2="434" y2="324" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="436" y="296" width="190" height="56" rx="8" class="bgN stN" stroke-width="1.5"/><text x="531.0" y="319.3" class="ink mono" font-size="12" text-anchor="middle" font-weight="600">UPDATE point</text><text x="531.0" y="337.0" class="ink2" font-size="11" text-anchor="middle">balance + 적립액</text><circle cx="630" cy="274" r="10" class="solR"/><text x="630.0" y="278.0" class="wh" font-size="12" text-anchor="middle" font-weight="700">5</text><line x1="640" y1="324" x2="674" y2="324" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><circle cx="657" cy="306" r="10" class="solR"/><text x="657.0" y="310.0" class="wh" font-size="12" text-anchor="middle" font-weight="700">4</text><rect x="676" y="296" width="180" height="56" rx="8" class="bgN stN" stroke-width="1.5"/><text x="766.0" y="319.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">오프셋 커밋</text><text x="766.0" y="337.0" class="ink2" font-size="11" text-anchor="middle">리스너 정상 반환 뒤</text><text x="24.0" y="398.0" class="ink2" font-size="12" text-anchor="start">점선 상자 하나가 한 DB 트랜잭션이다. 빨간 번호는 본문 "장애 시점별로 확인하면"의 번호다.</text></svg>
