<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="요청 스레드의 트랜잭션, MDC, SecurityContext는 작업 스레드로 넘어가지 않아 커밋 뒤 넘기기, TaskDecorator, Security 실행기 래퍼로 대응하고, 프로세스 경계는 traceparent 헤더로 잇는다"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.lnW { stroke: #ffffff; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="400" rx="8"/><text x="24.0" y="32.0" class="ink" font-size="16" text-anchor="start" font-weight="600">스레드를 넘으면 ThreadLocal이 비고, 프로세스를 넘으면 메모리가 다르다</text><rect x="24" y="70" width="236" height="262" rx="8" class="bgN stN" stroke-width="1.5"/><text x="40.0" y="94.0" class="ink" font-size="13" text-anchor="start" font-weight="700">요청 스레드</text><rect x="36" y="110" width="212" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="142.0" y="137.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">트랜잭션</text><text x="142.0" y="155.0" class="ink2" font-size="11" text-anchor="middle">현재 스레드에 묶여 있다</text><rect x="36" y="182" width="212" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="142.0" y="209.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">MDC (traceId)</text><text x="142.0" y="227.0" class="ink2" font-size="11" text-anchor="middle">로그에 찍힐 값</text><rect x="36" y="254" width="212" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="142.0" y="281.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">SecurityContext</text><text x="142.0" y="299.0" class="ink2" font-size="11" text-anchor="middle">로그인한 사용자</text><rect x="322" y="70" width="236" height="262" rx="8" class="bgN stN" stroke-width="1.5"/><text x="338.0" y="94.0" class="ink" font-size="13" text-anchor="start" font-weight="700">작업 스레드 (@Async)</text><rect x="334" y="110" width="212" height="64" rx="8" class="bgN stN" stroke-width="1.5" stroke-dasharray="5 4"/><text x="440.0" y="137.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">트랜잭션: 없음</text><text x="440.0" y="155.0" class="ink2" font-size="11" text-anchor="middle">커밋 뒤에 넘긴다 (AFTER_COMMIT)</text><rect x="334" y="182" width="212" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="440.0" y="209.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">MDC: 비어 있음</text><text x="440.0" y="227.0" class="ink2" font-size="11" text-anchor="middle">TaskDecorator가 복원한다</text><rect x="334" y="254" width="212" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="440.0" y="281.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">SecurityContext: 비어 있음</text><text x="440.0" y="299.0" class="ink2" font-size="11" text-anchor="middle">Security 실행기 래퍼가 넘긴다</text><rect x="620" y="70" width="236" height="262" rx="8" class="bgN stN" stroke-width="1.5"/><text x="636.0" y="94.0" class="ink" font-size="13" text-anchor="start" font-weight="700">다른 프로세스 (소비자·워커)</text><rect x="632" y="110" width="212" height="64" rx="8" class="bgN stN" stroke-width="1.5" stroke-dasharray="5 4"/><text x="738.0" y="137.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">메모리 공유 없음</text><text x="738.0" y="155.0" class="ink2" font-size="11" text-anchor="middle">값을 복사할 수 없다</text><rect x="632" y="182" width="212" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="738.0" y="209.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">traceparent 헤더</text><text x="738.0" y="227.0" class="ink2" font-size="11" text-anchor="middle">메시지 헤더에 실어 보낸다</text><rect x="632" y="254" width="212" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="738.0" y="281.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">같은 trace로 잇는다</text><text x="738.0" y="299.0" class="ink2" font-size="11" text-anchor="middle">헤더를 읽어 이어 간다</text><line x1="260" y1="200" x2="320" y2="200" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="290.0" y="182.0" class="ink2" font-size="11" text-anchor="middle" font-weight="700">스레드</text><text x="290.0" y="194.0" class="ink2" font-size="11" text-anchor="middle" font-weight="700">경계</text><line x1="558" y1="200" x2="618" y2="200" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="588.0" y="182.0" class="ink2" font-size="11" text-anchor="middle" font-weight="700">프로세스</text><text x="588.0" y="194.0" class="ink2" font-size="11" text-anchor="middle" font-weight="700">경계</text><text x="24.0" y="360.0" class="ink2" font-size="12" text-anchor="start">스레드 경계: 커밋 뒤에 넘기고, 남길 값은 데코레이터나 래퍼로 복사한다.</text><text x="24.0" y="380.0" class="ink2" font-size="12" text-anchor="start">프로세스 경계: W3C Trace Context의 traceparent를 메시지 헤더에 싣는다.</text></svg>
