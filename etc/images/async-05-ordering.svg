<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="주문 ID를 키로 쓰면 같은 주문의 이벤트가 같은 파티션에 순서대로 들어간다. 뒤집혀 도착하면 상태 이벤트는 낮은 버전을 버리고 증분 이벤트는 버리면 안 된다"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.lnW { stroke: #ffffff; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="400" rx="8"/><text x="24.0" y="32.0" class="ink" font-size="16" text-anchor="start" font-weight="600">순서는 키 단위로 지키고, 뒤집혀 오면 버전으로 판단한다</text><text x="24.0" y="52.0" class="muted" font-size="12" text-anchor="start">키 = 주문 ID. A, B는 서로 다른 주문</text><text x="24.0" y="84.0" class="ink" font-size="12" text-anchor="start" font-weight="700">보낸 순서</text><rect x="24" y="96" width="120" height="30" rx="8" class="bgB stB" stroke-width="1.5"/><text x="84.0" y="115.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">A 생성 v1</text><rect x="24" y="134" width="120" height="30" rx="8" class="bgA stA" stroke-width="1.5"/><text x="84.0" y="153.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">B 생성 v1</text><rect x="24" y="172" width="120" height="30" rx="8" class="bgB stB" stroke-width="1.5"/><text x="84.0" y="191.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">A 결제 v2</text><rect x="24" y="210" width="120" height="30" rx="8" class="bgB stB" stroke-width="1.5"/><text x="84.0" y="229.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">A 취소 v3</text><rect x="24" y="248" width="120" height="30" rx="8" class="bgA stA" stroke-width="1.5"/><text x="84.0" y="267.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">B 결제 v2</text><path d="M144,111 L160,111 L160,140 L196,140" class="lnB" stroke-width="1.6" marker-end="url(#mB)"/><path d="M144,149 L180,149 L180,268 L196,268" class="lnA" stroke-width="1.6" marker-end="url(#mA)"/><path d="M144,187 L160,187 L160,140 L196,140" class="lnB" stroke-width="1.6" marker-end="url(#mB)"/><path d="M144,225 L160,225 L160,140 L196,140" class="lnB" stroke-width="1.6" marker-end="url(#mB)"/><path d="M144,263 L180,263 L180,268 L196,268" class="lnA" stroke-width="1.6" marker-end="url(#mA)"/><rect x="198" y="100" width="316" height="80" rx="8" class="bgB stB" stroke-width="1.5"/><text x="210.0" y="120.0" class="txB" font-size="12" text-anchor="start" font-weight="700">파티션 0 (키 A)</text><rect x="210" y="132" width="92" height="34" rx="8" class="bgB stB" stroke-width="1.5"/><text x="256.0" y="153.0" class="ink" font-size="11" text-anchor="middle" font-weight="600">A 생성 v1</text><rect x="310" y="132" width="92" height="34" rx="8" class="bgB stB" stroke-width="1.5"/><text x="356.0" y="153.0" class="ink" font-size="11" text-anchor="middle" font-weight="600">A 결제 v2</text><rect x="410" y="132" width="92" height="34" rx="8" class="bgB stB" stroke-width="1.5"/><text x="456.0" y="153.0" class="ink" font-size="11" text-anchor="middle" font-weight="600">A 취소 v3</text><rect x="198" y="228" width="316" height="80" rx="8" class="bgA stA" stroke-width="1.5"/><text x="210.0" y="248.0" class="txA" font-size="12" text-anchor="start" font-weight="700">파티션 1 (키 B)</text><rect x="210" y="260" width="92" height="34" rx="8" class="bgA stA" stroke-width="1.5"/><text x="256.0" y="281.0" class="ink" font-size="11" text-anchor="middle" font-weight="600">B 생성 v1</text><rect x="310" y="260" width="92" height="34" rx="8" class="bgA stA" stroke-width="1.5"/><text x="356.0" y="281.0" class="ink" font-size="11" text-anchor="middle" font-weight="600">B 결제 v2</text><text x="198.0" y="334.0" class="ink2" font-size="12" text-anchor="start">같은 키는 같은 파티션으로 간다.</text><text x="198.0" y="352.0" class="ink2" font-size="12" text-anchor="start">파티션 안에서만 순서가 지켜지고,</text><text x="198.0" y="370.0" class="ink2" font-size="12" text-anchor="start">파티션끼리는 병렬로 처리된다.</text><text x="552.0" y="84.0" class="ink" font-size="12" text-anchor="start" font-weight="700">그래도 뒤집혀 도착하면</text><rect x="552" y="96" width="304" height="50" rx="8" class="bgN stN" stroke-width="1.5"/><text x="704.0" y="116.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">버전 5를 반영했는데 버전 4가 늦게 옴</text><text x="704.0" y="134.0" class="ink2" font-size="11" text-anchor="middle">재시도 큐·웹훅처럼 키로 못 막는 경우</text><line x1="640" y1="146" x2="640" y2="176" class="lnG" stroke-width="1.6" marker-end="url(#mG)"/><line x1="780" y1="146" x2="780" y2="176" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="552" y="178" width="148" height="104" rx="8" class="bgG stG" stroke-width="1.5"/><text x="626.0" y="217.1" class="ink" font-size="12" text-anchor="middle" font-weight="600">상태 이벤트</text><text x="626.0" y="234.7" class="ink2" font-size="11" text-anchor="middle">상태 = 결제 완료, v4</text><text x="626.0" y="251.6" class="txG" font-size="12" text-anchor="middle" font-weight="700">→ 버린다</text><rect x="708" y="178" width="148" height="104" rx="8" class="bgR stR" stroke-width="1.5"/><text x="782.0" y="217.1" class="ink" font-size="12" text-anchor="middle" font-weight="600">증분 이벤트</text><text x="782.0" y="234.7" class="ink2" font-size="11" text-anchor="middle">포인트 +10, v4</text><text x="782.0" y="251.6" class="txR" font-size="12" text-anchor="middle" font-weight="700">→ 버리면 안 된다</text><text x="552.0" y="308.0" class="ink2" font-size="12" text-anchor="start">증분 이벤트는 순서대로 적용하거나</text><text x="552.0" y="326.0" class="ink2" font-size="12" text-anchor="start">원본에서 최신 상태를 다시 읽는다.</text></svg>
