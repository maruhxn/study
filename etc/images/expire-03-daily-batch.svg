<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="서명 요청 24시간 뒤부터 차단이 즉시 적용되고, 정리는 다음 04시 배치가 하므로 최대 하루 서명 대기 상태가 남는 타임라인"><style>
