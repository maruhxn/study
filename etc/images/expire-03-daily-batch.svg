</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="300" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">차단은 기한에, 정리는 다음 배치에</text><line x1="40" y1="120" x2="856" y2="120" class="lnN" stroke-width="2"/><rect x="400" y="112" width="330" height="16" class="bgA"/><circle cx="90" cy="120" r="5" class="solI"/><circle cx="400" cy="120" r="5" class="solR"/><circle cx="730" cy="120" r="5" class="solG"/><text x="90" y="100" class="ink" font-size="12" text-anchor="middle" font-weight="600">서명 요청</text><text x="400" y="100" class="txR" font-size="12" text-anchor="middle" font-weight="600">24시간</text><text x="730" y="100" class="txG" font-size="12" text-anchor="middle" font-weight="600">다음 04시 배치</text><text x="400" y="150" class="txR" font-size="12" text-anchor="middle">차단: 이후 서명 완료는 거절</text><text x="565" y="176" class="txA" font-size="12" text-anchor="middle">최대 하루 서명 대기로 남음</text><text x="730" y="150" class="txG" font-size="12" text-anchor="middle">정리: 만료, 링크 닫기</text><rect x="24" y="214" width="832" height="60" rx="8" class="bgN stN" stroke-width="1.5"/><text x="440.0" y="237.0" class="ink" font-size="12" text-anchor="middle">차단이 기한에 걸려 있어, 정리가 하루 늦어도 우리 DB에 기한 뒤 서명이 등록되지 않는다</text><text x="440.0" y="255.0" class="ink" font-size="12" text-anchor="middle">그래서 예약 인프라 없이 하루 한 번 배치로 충분했다</text></svg>
