}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="400" rx="8"/><text x="24.0" y="32.0" class="ink" font-size="16" text-anchor="start" font-weight="600">일은 했는데 했다는 기록을 남기기 전에 죽으면 중복이 생긴다</text><rect x="24" y="70" width="130" height="60" rx="8" class="bgN stN" stroke-width="1.5"/><text x="89.0" y="95.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">보내는 쪽</text><text x="89.0" y="113.0" class="ink2" font-size="11" text-anchor="middle">Outbox 릴레이</text><rect x="174" y="70" width="130" height="60" rx="8" class="bgG stG" stroke-width="1.5"/><text x="239.0" y="104.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">브로커로 전송</text><line x1="304" y1="100" x2="324" y2="100" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="326" y="70" width="110" height="60" rx="8" class="bgG stG" stroke-width="1.5"/><text x="381.0" y="104.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">ack 받음</text><line x1="436" y1="100" x2="500" y2="100" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><circle cx="468" cy="100" r="11" class="solR"/><path d="M463,95 L473,105 M473,95 L463,105" class="lnW" stroke-width="2.2"/><text x="468.0" y="82.0" class="txR" font-size="11" text-anchor="middle" font-weight="700">크래시</text><rect x="502" y="70" width="140" height="60" rx="8" class="bgN stN" stroke-width="1.5" stroke-dasharray="5 4"/><text x="572.0" y="95.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">보냄 표시</text><text x="572.0" y="113.0" class="ink2 mono" font-size="11" text-anchor="middle">sent_at UPDATE</text><line x1="642" y1="100" x2="668" y2="100" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="670" y="70" width="186" height="60" rx="8" class="bgR stR" stroke-width="1.5"/><text x="763.0" y="95.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">같은 메시지가</text><text x="763.0" y="113.3" class="ink" font-size="12" text-anchor="middle">한 번 더 간다</text><text x="174.0" y="148.0" class="muted" font-size="11" text-anchor="start">재시작하면 같은 행을 다시 보낸다</text><rect x="24" y="170" width="130" height="60" rx="8" class="bgN stN" stroke-width="1.5"/><text x="89.0" y="195.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">받는 쪽</text><text x="89.0" y="213.0" class="ink2" font-size="11" text-anchor="middle">컨슈머</text><rect x="174" y="170" width="130" height="60" rx="8" class="bgG stG" stroke-width="1.5"/><text x="239.0" y="204.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">메시지 처리</text><line x1="304" y1="200" x2="324" y2="200" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="326" y="170" width="110" height="60" rx="8" class="bgG stG" stroke-width="1.5"/><text x="381.0" y="204.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">DB 커밋</text><line x1="436" y1="200" x2="500" y2="200" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><circle cx="468" cy="200" r="11" class="solR"/><path d="M463,195 L473,205 M473,195 L463,205" class="lnW" stroke-width="2.2"/><text x="468.0" y="182.0" class="txR" font-size="11" text-anchor="middle" font-weight="700">크래시</text><rect x="502" y="170" width="140" height="60" rx="8" class="bgN stN" stroke-width="1.5" stroke-dasharray="5 4"/><text x="572.0" y="195.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">오프셋 커밋</text><text x="572.0" y="213.0" class="ink2" font-size="11" text-anchor="middle">읽은 위치 기록</text><line x1="642" y1="200" x2="668" y2="200" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="670" y="170" width="186" height="60" rx="8" class="bgR stR" stroke-width="1.5"/><text x="763.0" y="195.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">같은 메시지가</text><text x="763.0" y="213.3" class="ink" font-size="12" text-anchor="middle">한 번 더 간다</text><text x="174.0" y="248.0" class="muted" font-size="11" text-anchor="start">재시작하면 마지막 커밋 위치부터 다시 읽는다</text><text x="24.0" y="290.0" class="ink" font-size="13" text-anchor="start" font-weight="700">받는 쪽이 메시지 ID를 기록하면 두 번째 도착을 건너뛸 수 있다</text><rect x="24" y="306" width="360" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="204.0" y="333.3" class="ink mono" font-size="12" text-anchor="middle" font-weight="600">INSERT processed_message(message_id)</text><text x="204.0" y="351.0" class="ink2" font-size="11" text-anchor="middle">UNIQUE 제약, 업무 변경과 같은 DB 트랜잭션</text><path d="M384,326 L430,326 L430,318 L466,318" class="lnG" stroke-width="1.6" marker-end="url(#mG)"/><path d="M384,350 L430,350 L430,358 L466,358" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="468" y="300" width="180" height="36" rx="8" class="bgG stG" stroke-width="1.5"/><text x="558.0" y="322.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">처음: 1행 삽입 → 처리</text><rect x="468" y="340" width="180" height="36" rx="8" class="bgN stN" stroke-width="1.5"/><text x="558.0" y="362.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">두 번째: 0행 → 건너뜀</text><text x="668.0" y="322.0" class="ink2" font-size="12" text-anchor="start">몇 번 와도</text><text x="668.0" y="340.0" class="ink2" font-size="12" text-anchor="start">적립은 한 번만 된다</text></svg>
