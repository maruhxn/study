<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="릴레이는 전송과 ack 뒤 보냄 표시 전에, 컨슈머는 처리와 DB 커밋 뒤 오프셋 커밋 전에 죽으면 같은 메시지를 다시 보내거나 받는다. 처리 이력 테이블로 두 번째를 건너뛴다"><style>
