<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="서명 요청 24시간 만료를 차단과 정리로 나누고, 정리를 맡을 네 가지 방식 중 주기 스캔을 하루 한 번 돌리는 선택"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="400" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">24시간 만료 = 차단 + 정리</text><rect x="24" y="56" width="200" height="64" rx="8" class="bgN stN" stroke-width="1.5"/><text x="124.0" y="81.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">서명 요청</text><text x="124.0" y="99.0" class="ink" font-size="12" text-anchor="middle">expires_at = 요청 + 24시간</text><line x1="224" y1="88" x2="258" y2="88" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="260" y="56" width="300" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="410.0" y="81.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">차단: 사용 시점 판정</text><text x="410.0" y="99.0" class="ink" font-size="12" text-anchor="middle">expires_at > now() 일 때만 완료</text><line x1="560" y1="88" x2="594" y2="88" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="596" y="56" width="260" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="726.0" y="81.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">기한이 지난 순간부터 막힌다</text><text x="726.0" y="99.0" class="ink" font-size="12" text-anchor="middle">실행할 작업이 필요 없음</text><line x1="124" y1="120" x2="124" y2="160" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="136" y="146" class="ink2" font-size="12" text-anchor="start" font-weight="600">정리: 상태를 EXPIRED로 바꾸고 후속 작업을 누가 언제 하나</text><rect x="24" y="162" width="196" height="64" rx="8" class="bgN stN" stroke-width="1.5"/><text x="122.0" y="187.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">① 요청 시 정리</text><text x="122.0" y="205.0" class="ink" font-size="12" text-anchor="middle">다음 요청이 왔을 때</text><rect x="232" y="162" width="196" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="330.0" y="187.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">② 주기 스캔</text><text x="330.0" y="205.0" class="ink" font-size="12" text-anchor="middle">배치가 주기마다 찾음</text><rect x="440" y="162" width="196" height="64" rx="8" class="bgN stN" stroke-width="1.5"/><text x="538.0" y="187.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">③ 건별 타이머</text><text x="538.0" y="205.0" class="ink" font-size="12" text-anchor="middle">만료 시각에 실행</text><rect x="648" y="162" width="196" height="64" rx="8" class="bgN stN" stroke-width="1.5" stroke-dasharray="5 4"/><text x="746.0" y="187.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">④ 저장소 TTL</text><text x="746.0" y="205.0" class="ink" font-size="12" text-anchor="middle">저장소가 지우기만 함</text><line x1="122" y1="226" x2="122" y2="270" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="330" y1="226" x2="330" y2="270" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="538" y1="226" x2="538" y2="270" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="746" y="250" class="muted" font-size="12" text-anchor="middle">기한 맞춘 후속 작업 어려움</text><rect x="24" y="272" width="612" height="52" rx="8" class="bgA stA" stroke-width="1.5"/><text x="330.0" y="291.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">조건부 상태 전이: 아직 서명 대기일 때만 한 번 바꾼다</text><text x="330.0" y="309.0" class="ink" font-size="12" text-anchor="middle">여러 방식이 겹쳐 돌아도 결과가 같다</text><text x="24" y="360" class="ink2" font-size="12" text-anchor="start">결제수단 등록 만료의 선택: 차단은 서명 완료 웹훅을 처리할 때, 정리는 ② 하루 한 번 배치</text></svg>
