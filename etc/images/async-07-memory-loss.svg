<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="@Async 메모리 큐에 있던 작업은 기본 설정의 정상 종료, 강제 종료, OOM에서 기록 없이 사라진다. 종료 대기를 설정하면 정상 종료 때만 기다린다"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.lnW { stroke: #ffffff; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="330" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="700">메모리 큐의 작업은 프로세스가 끝나면 함께 끝난다</text><rect x="24" y="60" width="250" height="190" rx="8" class="bgN stN" stroke-width="1.5"/><text x="149" y="84" class="ink" font-size="12" text-anchor="middle" font-weight="700">@Async 실행기 (프로세스 메모리)</text><rect x="40" y="100" width="218" height="40" rx="8" class="bgA stA" stroke-width="1.5"/><text x="149" y="125" class="ink" font-size="12" text-anchor="middle">실행 중: 알림 A</text><rect x="40" y="150" width="218" height="84" rx="8" class="bgN stN" stroke-width="1.5" stroke-dasharray="5 4"/><text x="149" y="172" class="ink2" font-size="12" text-anchor="middle">큐에서 대기</text><rect x="56" y="184" width="56" height="34" rx="8" class="bgB stB" stroke-width="1.5"/><text x="84" y="206" class="ink" font-size="12" text-anchor="middle" font-weight="700">B</text><rect x="122" y="184" width="56" height="34" rx="8" class="bgB stB" stroke-width="1.5"/><text x="150" y="206" class="ink" font-size="12" text-anchor="middle" font-weight="700">C</text><rect x="188" y="184" width="56" height="34" rx="8" class="bgB stB" stroke-width="1.5"/><text x="216" y="206" class="ink" font-size="12" text-anchor="middle" font-weight="700">D</text><rect x="330" y="60" width="526" height="58" rx="8" class="bgR stR" stroke-width="1.5"/><text x="346" y="82" class="ink" font-size="12" text-anchor="start" font-weight="700">정상 종료, 기본값</text><text x="600" y="82" class="ink2 mono" font-size="11" text-anchor="start">await-termination = false</text><text x="346" y="103" class="ink2" font-size="12" text-anchor="start">실행 중 작업을 잠시 기다린 뒤 인터럽트, 남은 큐는 지움</text><line x1="274" y1="155" x2="328" y2="89" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="330" y="126" width="526" height="58" rx="8" class="bgA stA" stroke-width="1.5"/><text x="346" y="148" class="ink" font-size="12" text-anchor="start" font-weight="700">정상 종료, 종료 대기 설정</text><text x="600" y="148" class="ink2 mono" font-size="11" text-anchor="start">await-termination + period</text><text x="346" y="169" class="ink2" font-size="12" text-anchor="start">기간 안에서 남은 작업을 실행, 넘기면 프로세스와 함께 사라짐</text><line x1="274" y1="155" x2="328" y2="155" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="330" y="192" width="526" height="58" rx="8" class="bgR stR" stroke-width="1.5"/><text x="346" y="214" class="ink" font-size="12" text-anchor="start" font-weight="700">kill -9 · OOM · 장비 장애</text><text x="600" y="214" class="ink2" font-size="11" text-anchor="start">기다릴 기회가 없다</text><text x="346" y="235" class="ink2" font-size="12" text-anchor="start">실행 중·대기 작업 모두 사라짐</text><line x1="274" y1="155" x2="328" y2="221" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><text x="24" y="282" class="ink2" font-size="12" text-anchor="start">어느 경우든 무엇이 사라졌는지 남는 기록이 없다. 다시 할 근거가 없으니 결과는 최대 한 번이다.</text><text x="24" y="304" class="ink" font-size="12" text-anchor="start">유실을 허용할 수 없다면 작업을 프로세스 밖, 브로커나 업무 DB에 둔다.</text></svg>
