<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="동기 처리는 주문 저장과 알림 발송이 끝난 뒤 응답하고, 비동기 처리는 주문 저장과 큐 적재 후 바로 응답하며 알림은 작업 스레드가 나중에 처리한다"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.lnW { stroke: #ffffff; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="330" rx="8"/><text x="24.0" y="32.0" class="ink" font-size="16" text-anchor="start" font-weight="600">동기로 두면 응답이 작업 완료를 기다린다</text><text x="24.0" y="52.0" class="muted" font-size="12" text-anchor="start">비동기로 빼면 응답은 빨라지고, 응답과 완료 사이에 미완료 구간이 생긴다</text><text x="24.0" y="108.0" class="ink" font-size="13" text-anchor="start" font-weight="700">동기</text><rect x="120" y="86" width="150" height="40" rx="8" class="bgN stN" stroke-width="1.5"/><text x="195.0" y="110.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">주문 저장</text><rect x="270" y="86" width="300" height="40" rx="8" class="bgA stA" stroke-width="1.5"/><text x="420.0" y="110.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">알림 발송 (푸시 서버 호출)</text><line x1="570" y1="76" x2="570" y2="136" class="lnB" stroke-width="2"/><text x="578.0" y="80.0" class="txB" font-size="12" text-anchor="start" font-weight="700">응답</text><text x="24.0" y="188.0" class="ink" font-size="13" text-anchor="start" font-weight="700">비동기</text><text x="24.0" y="238.0" class="ink2" font-size="12" text-anchor="start">작업 스레드</text><rect x="120" y="166" width="150" height="40" rx="8" class="bgN stN" stroke-width="1.5"/><text x="195.0" y="190.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">주문 저장</text><rect x="270" y="166" width="60" height="40" rx="8" class="bgB stB" stroke-width="1.5"/><text x="300.0" y="190.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">큐</text><line x1="330" y1="156" x2="330" y2="270" class="lnB" stroke-width="2"/><text x="338.0" y="160.0" class="txB" font-size="12" text-anchor="start" font-weight="700">응답</text><rect x="340" y="166" width="300" height="40" rx="8" class="bgR stR" stroke-width="1.2" stroke-dasharray="5 4"/><text x="490.0" y="190.3" class="txR" font-size="12" text-anchor="middle" font-weight="700">접수됐지만 아직 안 끝난 구간</text><rect x="340" y="222" width="300" height="40" rx="8" class="bgA stA" stroke-width="1.5"/><text x="490.0" y="246.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">알림 발송 (푸시 서버 호출)</text><path d="M300,206 L300,242 L338,242" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="640" y1="156" x2="640" y2="270" class="lnG" stroke-width="2"/><text x="648.0" y="160.0" class="txG" font-size="12" text-anchor="start" font-weight="700">완료</text><line x1="120" y1="292" x2="840" y2="292" class="lnN" stroke-width="1.2" marker-end="url(#mN)"/><text x="840.0" y="310.0" class="muted" font-size="11" text-anchor="end">시간</text><text x="24.0" y="316.0" class="ink2" font-size="12" text-anchor="start">이 구간에 서버가 죽거나 작업이 실패하면 누가 다시 하나? 이것이 4절의 문제다.</text></svg>
