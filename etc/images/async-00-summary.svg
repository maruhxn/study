<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" role="img" aria-label="비동기 처리 한 장 요약. 출발 질문, 두 층의 구분, 비동기로 얻는 것 여섯 가지, 떠안는 문제 열 가지와 해법, 실행 모델과 연동 방식과 결과 전달 선택지, 고르는 순서"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.lnW { stroke: #ffffff; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="700" rx="8"/><text x="24.0" y="32.0" class="ink" font-size="16" text-anchor="start" font-weight="600">비동기로 빼기 전에: 얻는 것, 떠안는 것, 고르는 것</text><text x="24.0" y="52.0" class="muted" font-size="12" text-anchor="start">출발 질문 하나에서 시작해 왼쪽에서 오른쪽으로 읽는다</text><rect x="24" y="68" width="832" height="56" rx="8" class="bgB stB" stroke-width="1.5"/><text x="40.0" y="92.0" class="txB" font-size="12" text-anchor="start" font-weight="700">출발 질문 · 1절</text><text x="40.0" y="111.0" class="ink" font-size="13" text-anchor="start" font-weight="600">이 응답을 만들기 전에 결과가 필요한가?</text><text x="420.0" y="92.0" class="ink" font-size="12" text-anchor="start" font-weight="600">예 → 동기로 둔다</text><text x="420.0" y="111.0" class="ink2" font-size="12" text-anchor="start">타임아웃 · 재시도 · 멱등키로 호출을 안전하게</text><text x="668.0" y="92.0" class="txG" font-size="12" text-anchor="start" font-weight="700">아니오 → 비동기로 뺀다</text><text x="668.0" y="111.0" class="ink2" font-size="12" text-anchor="start">아래 칸을 따라간다</text><rect x="24" y="134" width="408" height="46" rx="8" class="bgN stN" stroke-width="1.5"/><text x="40.0" y="154.0" class="ink" font-size="12" text-anchor="start" font-weight="700">코드 실행 층 (프로세스 안) · 2절</text><text x="40.0" y="171.0" class="ink2" font-size="11" text-anchor="start">스레드를 아낀다. 유실·중복과는 무관하다 → 4절</text><rect x="448" y="134" width="408" height="46" rx="8" class="bgN stN" stroke-width="1.5"/><text x="464.0" y="154.0" class="ink" font-size="12" text-anchor="start" font-weight="700">시스템 연동 층 (응답 경로 밖) · 2절</text><text x="464.0" y="171.0" class="ink2" font-size="11" text-anchor="start">신뢰성 문제가 생기는 곳 → 3·5·6절</text><text x="24.0" y="214.0" class="txG" font-size="13" text-anchor="start" font-weight="700">얻는 것 · 1절</text><rect x="24" y="230" width="196" height="50" rx="8" class="bgG stG" stroke-width="1.5"/><text x="122.0" y="250.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">응답 시간 단축</text><text x="122.0" y="268.0" class="ink2" font-size="11" text-anchor="middle">알림·적립을 응답 뒤로</text><rect x="24" y="288" width="196" height="50" rx="8" class="bgG stG" stroke-width="1.5"/><text x="122.0" y="308.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">장애 격리</text><text x="122.0" y="326.0" class="ink2" font-size="11" text-anchor="middle">연동 실패가 번지지 않음</text><rect x="24" y="346" width="196" height="50" rx="8" class="bgG stG" stroke-width="1.5"/><text x="122.0" y="366.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">부하 평탄화</text><text x="122.0" y="384.0" class="ink2" font-size="11" text-anchor="middle">버퍼가 피크를 흡수</text><rect x="24" y="404" width="196" height="50" rx="8" class="bgG stG" stroke-width="1.5"/><text x="122.0" y="424.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">확장</text><text x="122.0" y="442.0" class="ink2" font-size="11" text-anchor="middle">구독자만 추가</text><rect x="24" y="462" width="196" height="50" rx="8" class="bgG stG" stroke-width="1.5"/><text x="122.0" y="482.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">긴 작업 처리</text><text x="122.0" y="500.0" class="ink2" font-size="11" text-anchor="middle">접수만 하고 나중에</text><rect x="24" y="520" width="196" height="50" rx="8" class="bgG stG" stroke-width="1.5"/><text x="122.0" y="540.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">자원 효율</text><text x="122.0" y="558.0" class="ink2" font-size="11" text-anchor="middle">코드 실행 층의 이득</text><text x="244.0" y="214.0" class="txR" font-size="13" text-anchor="start" font-weight="700">떠안는 것과 해법 · 3절</text><rect x="244" y="230" width="380" height="30" rx="6" class="bgN stN" stroke-width="1.5"/><text x="254.0" y="249.5" class="txR" font-size="12" text-anchor="start" font-weight="700">① 유실</text><text x="424.0" y="249.5" class="ink" font-size="12" text-anchor="start">→ 영속 저장소 (브로커 · DB)</text><rect x="244" y="264.4" width="380" height="30" rx="6" class="bgN stN" stroke-width="1.5"/><text x="254.0" y="283.9" class="txR" font-size="12" text-anchor="start" font-weight="700">② 이중 쓰기</text><text x="424.0" y="283.9" class="ink" font-size="12" text-anchor="start">→ Transactional Outbox, CDC</text><rect x="244" y="298.79999999999995" width="380" height="30" rx="6" class="bgN stN" stroke-width="1.5"/><text x="254.0" y="318.3" class="txR" font-size="12" text-anchor="start" font-weight="700">③ 중복</text><text x="424.0" y="318.3" class="ink" font-size="12" text-anchor="start">→ 받는 쪽 멱등 처리</text><rect x="244" y="333.19999999999993" width="380" height="30" rx="6" class="bgN stN" stroke-width="1.5"/><text x="254.0" y="352.7" class="txR" font-size="12" text-anchor="start" font-weight="700">④ 순서 역전</text><text x="424.0" y="352.7" class="ink" font-size="12" text-anchor="start">→ 키 단위 순서 + 버전</text><rect x="244" y="367.5999999999999" width="380" height="30" rx="6" class="bgN stN" stroke-width="1.5"/><text x="254.0" y="387.1" class="txR" font-size="12" text-anchor="start" font-weight="700">⑤ 실패와 독 메시지</text><text x="424.0" y="387.1" class="ink" font-size="12" text-anchor="start">→ 백오프 · 지터 재시도, DLQ</text><rect x="244" y="401.9999999999999" width="380" height="30" rx="6" class="bgN stN" stroke-width="1.5"/><text x="254.0" y="421.5" class="txR" font-size="12" text-anchor="start" font-weight="700">⑥ 적체</text><text x="424.0" y="421.5" class="ink" font-size="12" text-anchor="start">→ 메시지의 나이 감시</text><rect x="244" y="436.39999999999986" width="380" height="30" rx="6" class="bgN stN" stroke-width="1.5"/><text x="254.0" y="455.9" class="txR" font-size="12" text-anchor="start" font-weight="700">⑦ 결과 전달·멈춘 작업</text><text x="424.0" y="455.9" class="ink" font-size="12" text-anchor="start">→ 상태 리소스, 임대와 회수</text><rect x="244" y="470.79999999999984" width="380" height="30" rx="6" class="bgN stN" stroke-width="1.5"/><text x="254.0" y="490.3" class="txR" font-size="12" text-anchor="start" font-weight="700">⑧ 되돌릴 수 없음</text><text x="424.0" y="490.3" class="ink" font-size="12" text-anchor="start">→ 사가, 보상 트랜잭션</text><rect x="244" y="505.1999999999998" width="380" height="30" rx="6" class="bgN stN" stroke-width="1.5"/><text x="254.0" y="524.7" class="txR" font-size="12" text-anchor="start" font-weight="700">⑨ 컨텍스트·추적 단절</text><text x="424.0" y="524.7" class="ink" font-size="12" text-anchor="start">→ 컨텍스트 전파, traceparent</text><rect x="244" y="539.5999999999998" width="380" height="30" rx="6" class="bgN stN" stroke-width="1.5"/><text x="254.0" y="559.1" class="txR" font-size="12" text-anchor="start" font-weight="700">⑩ 설계 밖 불일치</text><text x="424.0" y="559.1" class="ink" font-size="12" text-anchor="start">→ 대사</text><text x="648.0" y="214.0" class="txB" font-size="13" text-anchor="start" font-weight="700">고르는 것 · 4~6절</text><rect x="648" y="230" width="208" height="106" rx="8" class="bgB stB" stroke-width="1.5"/><text x="752.0" y="260.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">실행 모델 · 4절</text><text x="752.0" y="278.3" class="ink" font-size="12" text-anchor="middle">스레드 풀 · 리액티브</text><text x="752.0" y="296.3" class="ink" font-size="12" text-anchor="middle">코루틴 · 가상 스레드</text><text x="752.0" y="314.0" class="ink2" font-size="11" text-anchor="middle">스레드만 아낀다</text><rect x="648" y="346" width="208" height="106" rx="8" class="bgB stB" stroke-width="1.5"/><text x="752.0" y="376.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">연동 방식 · 5절</text><text x="752.0" y="394.3" class="ink" font-size="12" text-anchor="middle">별도 스레드 · 직접 전송</text><text x="752.0" y="412.3" class="ink" font-size="12" text-anchor="middle">Outbox · 배치 · CDC</text><text x="752.0" y="430.0" class="ink2" font-size="11" text-anchor="middle">작업을 어디에 두나</text><rect x="648" y="462" width="208" height="106" rx="8" class="bgB stB" stroke-width="1.5"/><text x="752.0" y="492.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">결과 전달 · 6절</text><text x="752.0" y="510.3" class="ink" font-size="12" text-anchor="middle">202 + 폴링 · 웹훅</text><text x="752.0" y="528.3" class="ink" font-size="12" text-anchor="middle">WebSocket · SSE</text><text x="752.0" y="546.0" class="ink2" font-size="11" text-anchor="middle">검증 후 202, 멱등키</text><line x1="222" y1="366" x2="242" y2="366" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="626" y1="366" x2="646" y2="366" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="24" y="610" width="832" height="70" rx="8" class="bgA stA" stroke-width="1.5"/><text x="40.0" y="634.0" class="ink" font-size="13" text-anchor="start" font-weight="600">기본값은 at-least-once다. 유실은 영속 저장소로 막고, 중복은 받는 쪽 멱등 처리로 흡수한다.</text><text x="40.0" y="656.0" class="ink2" font-size="12" text-anchor="start">고르는 순서 · 7절: 유실 비용이 커지는 만큼 별도 스레드 → 직접 전송 → Outbox. 실무 예시 · 8절, 설정 기본값 · 9절</text></svg>
