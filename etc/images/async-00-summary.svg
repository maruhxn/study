<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" role="img" aria-label="비동기 처리 요약: 결과가 응답 전에 필요한지 묻고, 뺀 작업을 어디에 둘지 정하고, 그 조건에 따라 생기는 문제와 해법, 그리고 고르는 것들"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.lnW { stroke: #ffffff; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="700" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="700">비동기로 빼기 전에: 얻는 것, 떠안는 것, 고르는 것</text><text x="24" y="52" class="ink2" font-size="12" text-anchor="start">위에서 아래로 읽는다</text><rect x="24" y="66" width="832" height="56" rx="8" class="bgN stN" stroke-width="1.5"/><text x="40" y="90" class="ink2" font-size="11" text-anchor="start">출발 질문 · 1절</text><text x="40" y="110" class="ink" font-size="13" text-anchor="start" font-weight="700">이 응답을 만들기 전에 결과가 필요한가?</text><text x="420" y="90" class="ink2" font-size="12" text-anchor="start">예 → 동기로 둔다 (타임아웃 · 재시도 · 멱등키)</text><text x="420" y="110" class="txB" font-size="12" text-anchor="start" font-weight="700">아니오 → 비동기로 뺀다. 아래를 따라간다</text><line x1="440" y1="122" x2="440" y2="140" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="24" y="160" class="ink" font-size="13" text-anchor="start" font-weight="700">작업을 어디에 두나 · 3절</text><rect x="24" y="170" width="272" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="160" y="192" class="ink" font-size="12" text-anchor="middle" font-weight="700">메모리</text><text x="160" y="210" class="ink2" font-size="11" text-anchor="middle">죽으면 사라짐 · 최대 한 번</text><rect x="304" y="170" width="272" height="52" rx="8" class="bgB stB" stroke-width="1.5"/><text x="440" y="192" class="ink" font-size="12" text-anchor="middle" font-weight="700">브로커 (메시지 큐)</text><text x="440" y="210" class="ink2" font-size="11" text-anchor="middle">남음 · 적어도 한 번 · 업무 DB와 따로 씀</text><rect x="584" y="170" width="272" height="52" rx="8" class="bgG stG" stroke-width="1.5"/><text x="720" y="192" class="ink" font-size="12" text-anchor="middle" font-weight="700">업무 DB</text><text x="720" y="210" class="ink2" font-size="11" text-anchor="middle">남음 · 적어도 한 번 · 같은 트랜잭션</text><line x1="440" y1="222" x2="440" y2="240" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="24" y="260" class="ink" font-size="13" text-anchor="start" font-weight="700">떠안는 문제와 해법 · 4절 (어떤 조건에서 생기나로 나눈다)</text><rect x="24" y="272" width="412" height="112" rx="8" class="bgN stN" stroke-width="1.5"/><text x="38" y="292" class="ink" font-size="12" text-anchor="start" font-weight="700">어디에 두든 · 4.1</text><text x="38" y="310" class="ink2" font-size="11" text-anchor="start">결과를 모른다 → 상태 리소스</text><text x="38" y="328" class="ink2" font-size="11" text-anchor="start">적체 → 가장 오래된 작업의 나이 감시</text><text x="38" y="346" class="ink2" font-size="11" text-anchor="start">순서 역전 → 키 단위 순서 + 버전</text><text x="38" y="364" class="ink2" font-size="11" text-anchor="start">컨텍스트 단절 → 값 전파, 추적 ID</text><rect x="444" y="272" width="412" height="52" rx="8" class="bgR stR" stroke-width="1.5"/><text x="458" y="292" class="ink" font-size="12" text-anchor="start" font-weight="700">메모리에 두면 · 4.2</text><text x="458" y="310" class="ink2" font-size="11" text-anchor="start">유실 → 브로커나 DB에 둔다</text><rect x="444" y="332" width="412" height="52" rx="8" class="bgA stA" stroke-width="1.5"/><text x="458" y="352" class="ink" font-size="12" text-anchor="start" font-weight="700">DB와 브로커에 따로 쓰면 · 4.3</text><text x="458" y="370" class="ink2" font-size="11" text-anchor="start">이중 쓰기 → Transactional Outbox</text><rect x="24" y="392" width="412" height="92" rx="8" class="bgB stB" stroke-width="1.5"/><text x="38" y="412" class="ink" font-size="12" text-anchor="start" font-weight="700">다시 시도하면 · 4.4</text><text x="38" y="430" class="ink2" font-size="11" text-anchor="start">중복 → 받는 쪽 멱등 처리</text><text x="38" y="448" class="ink2" font-size="11" text-anchor="start">독 메시지 → 간격 늘린 재시도, DLQ</text><text x="38" y="466" class="ink2" font-size="11" text-anchor="start">멈춘 작업 → 만료 시각을 두고 회수</text><rect x="444" y="392" width="412" height="44" rx="8" class="bgN stN" stroke-width="1.5"/><text x="458" y="412" class="ink" font-size="12" text-anchor="start" font-weight="700">여러 서비스에 걸치면 · 4.5</text><text x="458" y="430" class="ink2" font-size="11" text-anchor="start">되돌릴 수 없음 → 사가, 보상</text><rect x="444" y="442" width="412" height="42" rx="8" class="bgN stN" stroke-width="1.5"/><text x="458" y="462" class="ink" font-size="12" text-anchor="start" font-weight="700">마지막 방어선 · 4.6</text><text x="458" y="480" class="ink2" font-size="11" text-anchor="start">설계 밖 불일치 → 대사</text><line x1="440" y1="484" x2="440" y2="504" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="24" y="524" class="ink" font-size="13" text-anchor="start" font-weight="700">고르는 것 · 5~7절</text><rect x="24" y="534" width="272" height="70" rx="8" class="bgN stN" stroke-width="1.5"/><text x="38" y="556" class="ink" font-size="12" text-anchor="start" font-weight="700">실행 모델 · 5절</text><text x="38" y="575" class="ink2" font-size="11" text-anchor="start">스레드만 아낀다. 유실 · 중복과 무관</text><text x="38" y="593" class="ink2" font-size="11" text-anchor="start">풀 · 리액티브 · 코루틴 · 가상 스레드</text><rect x="304" y="534" width="272" height="70" rx="8" class="bgN stN" stroke-width="1.5"/><text x="318" y="556" class="ink" font-size="12" text-anchor="start" font-weight="700">결과 전달 · 6절</text><text x="318" y="575" class="ink2" font-size="11" text-anchor="start">요청자가 결과를 기다릴 때</text><text x="318" y="593" class="ink2" font-size="11" text-anchor="start">202 + 폴링 · 웹훅 · SSE</text><rect x="584" y="534" width="272" height="70" rx="8" class="bgN stN" stroke-width="1.5"/><text x="598" y="556" class="ink" font-size="12" text-anchor="start" font-weight="700">연동 방식 · 7절</text><text x="598" y="575" class="ink2" font-size="11" text-anchor="start">유실 비용이 커지는 만큼 옮겨 간다</text><text x="598" y="593" class="ink2" font-size="11" text-anchor="start">별도 스레드 → 메시징 직접 전송 → Outbox</text><rect x="24" y="620" width="832" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="40" y="646" class="ink" font-size="12" text-anchor="start" font-weight="700">유실은 작업을 브로커나 DB에 둬서 막고, 재전달이 만드는 중복은 받는 쪽 멱등 처리로 흡수한다.</text><text x="40" y="668" class="ink2" font-size="11" text-anchor="start">실무 예시 · 8절: 한 주문 API 안에서 알림은 메모리로, 포인트 적립은 Outbox로 뺀다. 설정 기본값 · 9절</text></svg>
