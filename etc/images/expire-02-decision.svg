<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="데이터가 사라지기만 하면 되는지, 후속 작업이 있는지, 후속 요청이 반드시 오는지, 정리가 주기만큼 늦어도 되는지 차례로 물어 정리 방식을 고르는 결정 흐름"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="470" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">위에서부터 답하며 내려간다</text><rect x="24" y="60" width="280" height="60" rx="8" class="bgN stN" stroke-width="1.5"/><text x="164.0" y="83.0" class="ink" font-size="12" text-anchor="middle">기한이 지나면 데이터가</text><text x="164.0" y="101.0" class="ink" font-size="12" text-anchor="middle">사라지기만 하면 되는가?</text><line x1="304" y1="90" x2="396" y2="90" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="350" y="82" class="txG" font-size="12" text-anchor="middle" font-weight="600">예</text><rect x="398" y="60" width="240" height="60" rx="8" class="bgA stA" stroke-width="1.5"/><text x="518.0" y="83.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">④ 저장소 TTL</text><text x="518.0" y="101.0" class="ink" font-size="12" text-anchor="middle">+ 읽을 때 만료 조건</text><line x1="164" y1="120" x2="164" y2="148" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="176" y="140" class="txR" font-size="12" text-anchor="start" font-weight="600">아니오</text><rect x="24" y="150" width="280" height="60" rx="8" class="bgN stN" stroke-width="1.5"/><text x="164.0" y="173.0" class="ink" font-size="12" text-anchor="middle">기한 뒤 실행할 후속 작업</text><text x="164.0" y="191.0" class="ink" font-size="12" text-anchor="middle">(상태 기록, 외부 링크 닫기)이 있는가?</text><line x1="304" y1="180" x2="396" y2="180" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="350" y="172" class="txR" font-size="12" text-anchor="middle" font-weight="600">아니오</text><rect x="398" y="150" width="240" height="60" rx="8" class="bgB stB" stroke-width="1.5"/><text x="518.0" y="173.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">차단(사용 시점 판정)만</text><text x="518.0" y="191.0" class="ink" font-size="12" text-anchor="middle">정리 없이 끝</text><line x1="164" y1="210" x2="164" y2="238" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="176" y="230" class="txG" font-size="12" text-anchor="start" font-weight="600">예</text><rect x="24" y="240" width="280" height="60" rx="8" class="bgN stN" stroke-width="1.5"/><text x="164.0" y="263.0" class="ink" font-size="12" text-anchor="middle">모든 대상에 후속 요청이</text><text x="164.0" y="281.0" class="ink" font-size="12" text-anchor="middle">반드시 다시 오는가?</text><line x1="304" y1="270" x2="396" y2="270" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="350" y="262" class="txG" font-size="12" text-anchor="middle" font-weight="600">예</text><rect x="398" y="240" width="240" height="60" rx="8" class="bgN stN" stroke-width="1.5"/><text x="518.0" y="263.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">① 요청 시 정리</text><text x="518.0" y="281.0" class="ink" font-size="12" text-anchor="middle">조회 시점에 정리됨</text><line x1="164" y1="300" x2="164" y2="328" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="176" y="320" class="txR" font-size="12" text-anchor="start" font-weight="600">아니오</text><rect x="24" y="330" width="280" height="60" rx="8" class="bgN stN" stroke-width="1.5"/><text x="164.0" y="353.0" class="ink" font-size="12" text-anchor="middle">정리가 한 주기만큼</text><text x="164.0" y="371.0" class="ink" font-size="12" text-anchor="middle">늦어도 되는가?</text><line x1="304" y1="360" x2="396" y2="360" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="350" y="352" class="txG" font-size="12" text-anchor="middle" font-weight="600">예</text><rect x="398" y="330" width="240" height="60" rx="8" class="bgG stG" stroke-width="1.5"/><text x="518.0" y="362.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">② 주기 스캔</text><line x1="164" y1="390" x2="164" y2="418" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="176" y="410" class="txR" font-size="12" text-anchor="start" font-weight="600">아니오</text><rect x="24" y="420" width="400" height="40" rx="8" class="bgB stB" stroke-width="1.5"/><text x="224.0" y="442.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">③ 건별 타이머 + ② 백업 스캔</text><rect x="664" y="160" width="192" height="100" rx="8" class="bgN stN" stroke-width="1.5"/><text x="760.0" y="194.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">어느 경우든</text><text x="760.0" y="212.0" class="ink" font-size="12" text-anchor="middle">차단은 사용 시점 판정으로</text><text x="760.0" y="230.0" class="ink" font-size="12" text-anchor="middle">상태 전이는 조건부로</text></svg>
