</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="700" rx="8"/><text x="24.0" y="32.0" class="ink" font-size="16" text-anchor="start" font-weight="600">비동기 처리 방식 고르기</text><text x="24.0" y="52.0" class="muted" font-size="12" text-anchor="start">위에서부터 질문에 답하며 내려간다</text><rect x="24" y="72" width="340" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="194.0" y="98.9" class="ink" font-size="13" text-anchor="middle" font-weight="600">결과가 이 HTTP 응답을</text><text x="194.0" y="118.4" class="ink" font-size="13" text-anchor="middle" font-weight="600">만들기 전에 필요한가?</text><line x1="364" y1="104" x2="436" y2="104" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="400.0" y="96.0" class="ink2" font-size="12" text-anchor="middle" font-weight="700">예</text><rect x="438" y="72" width="418" height="64" rx="8" class="bgN stN" stroke-width="1.5"/><text x="647.0" y="99.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">동기 호출</text><text x="647.0" y="117.0" class="ink2" font-size="11" text-anchor="middle">타임아웃 · 재시도 · 멱등키</text><line x1="194" y1="136" x2="194" y2="166" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="204.0" y="156.0" class="ink2" font-size="12" text-anchor="start" font-weight="700">아니오</text><rect x="24" y="168" width="340" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="194.0" y="204.7" class="ink" font-size="13" text-anchor="middle" font-weight="600">유실돼도 되는가?</text><line x1="364" y1="200" x2="436" y2="200" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="400.0" y="192.0" class="ink2" font-size="12" text-anchor="middle" font-weight="700">예</text><rect x="438" y="168" width="418" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="647.0" y="195.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">별도 스레드</text><text x="647.0" y="213.0" class="ink2" font-size="11" text-anchor="middle">AFTER_COMMIT · 큐 상한</text><line x1="194" y1="232" x2="194" y2="262" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="204.0" y="252.0" class="ink2" font-size="12" text-anchor="start" font-weight="700">아니오</text><rect x="24" y="264" width="340" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="194.0" y="290.9" class="ink" font-size="13" text-anchor="middle" font-weight="600">커밋 직후 크래시로 빠진 이벤트를</text><text x="194.0" y="310.4" class="ink" font-size="13" text-anchor="middle" font-weight="600">대사로 메울 수 있나?</text><line x1="364" y1="296" x2="436" y2="296" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="400.0" y="288.0" class="ink2" font-size="12" text-anchor="middle" font-weight="700">예</text><rect x="438" y="264" width="418" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="647.0" y="291.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">메시징 직접 전송</text><text x="647.0" y="309.0" class="ink2" font-size="11" text-anchor="middle">커밋 뒤 전송, 빠진 건은 대사로</text><line x1="194" y1="328" x2="194" y2="358" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="204.0" y="348.0" class="ink2" font-size="12" text-anchor="start" font-weight="700">아니오</text><rect x="24" y="360" width="340" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="194.0" y="386.9" class="ink" font-size="13" text-anchor="middle" font-weight="600">시차가 원래 크게 허용되는</text><text x="194.0" y="406.4" class="ink" font-size="13" text-anchor="middle" font-weight="600">대량 데이터인가?</text><line x1="364" y1="392" x2="436" y2="392" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="400.0" y="384.0" class="ink2" font-size="12" text-anchor="middle" font-weight="700">예</text><rect x="438" y="360" width="418" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="647.0" y="387.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">배치</text><text x="647.0" y="405.0" class="ink2" font-size="11" text-anchor="middle">원본이 DB에 그대로, 지연 = 주기</text><line x1="194" y1="424" x2="194" y2="454" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="204.0" y="444.0" class="ink2" font-size="12" text-anchor="start" font-weight="700">아니오</text><rect x="24" y="456" width="340" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="194.0" y="482.9" class="ink" font-size="13" text-anchor="middle" font-weight="600">모든 쓰기 경로에</text><text x="194.0" y="502.4" class="ink" font-size="13" text-anchor="middle" font-weight="600">연동 코드를 넣을 수 있나?</text><line x1="364" y1="488" x2="436" y2="488" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="400.0" y="480.0" class="ink2" font-size="12" text-anchor="middle" font-weight="700">예</text><rect x="438" y="456" width="418" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="647.0" y="483.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">Outbox + 브로커</text><text x="647.0" y="501.0" class="ink2" font-size="11" text-anchor="middle">릴레이는 폴링 또는 CDC</text><line x1="194" y1="520" x2="194" y2="550" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="204.0" y="540.0" class="ink2" font-size="12" text-anchor="start" font-weight="700">아니오</text><rect x="24" y="552" width="340" height="64" rx="8" class="bgA stA" stroke-width="1.5"/><text x="194.0" y="579.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">업무 테이블 CDC</text><text x="194.0" y="597.0" class="ink2" font-size="11" text-anchor="middle">행 변경 ≠ 업무 이벤트</text><rect x="24" y="632" width="832" height="50" rx="8" class="bgA stA" stroke-width="1.5"/><text x="40.0" y="653.0" class="ink" font-size="12" text-anchor="start" font-weight="700">비동기 쪽을 골랐다면 어느 길이든 따라오는 것</text><text x="40.0" y="671.0" class="ink2" font-size="12" text-anchor="start">결과 전달 (6절) · 멱등 소비 (3.2) · 대사 (3.8)</text></svg>
