<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" role="img" aria-label="비동기 처리 방식을 고르는 순서. 응답 전에 결과가 필요하면 동기, 유실돼도 되면 별도 스레드, 커밋 직후 유실을 대사로 메울 수 있으면 메시징 직접 전송, 시차가 허용된 대량 데이터면 배치, 모든 쓰기 경로에 코드를 넣을 수 있으면 Outbox, 아니면 업무 테이블 CDC"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
