<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="PENDING 작업을 워커가 토큰과 임대 만료 시각과 함께 RUNNING으로 잡고, 완료는 토큰이 맞을 때만 성공한다. 임대가 지나면 회수 스케줄러가 PENDING으로 되돌린다"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.lnW { stroke: #ffffff; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="360" rx="8"/><text x="24.0" y="32.0" class="ink" font-size="16" text-anchor="start" font-weight="600">임대가 지난 작업은 회수하고, 완료는 토큰으로 확인한다</text><rect x="24" y="130" width="150" height="64" rx="8" class="bgN stN" stroke-width="1.5"/><text x="99.0" y="157.3" class="ink mono" font-size="12" text-anchor="middle" font-weight="600">PENDING</text><text x="99.0" y="175.0" class="ink2" font-size="11" text-anchor="middle">대기</text><rect x="352" y="130" width="170" height="64" rx="8" class="bgA stA" stroke-width="1.5"/><text x="437.0" y="157.3" class="ink mono" font-size="12" text-anchor="middle" font-weight="600">RUNNING</text><text x="437.0" y="175.0" class="ink2 mono" font-size="11" text-anchor="middle">token, lease_until</text><rect x="696" y="76" width="160" height="56" rx="8" class="bgG stG" stroke-width="1.5"/><text x="776.0" y="99.3" class="ink mono" font-size="12" text-anchor="middle" font-weight="600">SUCCEEDED</text><text x="776.0" y="117.0" class="ink2" font-size="11" text-anchor="middle">완료</text><rect x="696" y="196" width="160" height="56" rx="8" class="bgR stR" stroke-width="1.5"/><text x="776.0" y="219.3" class="ink mono" font-size="12" text-anchor="middle" font-weight="600">FAILED</text><text x="776.0" y="237.0" class="ink2" font-size="11" text-anchor="middle">재시도 한도 초과</text><line x1="174" y1="162" x2="350" y2="162" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="262.0" y="144.0" class="ink" font-size="12" text-anchor="middle" font-weight="700">워커가 잡는다</text><text x="262.0" y="182.0" class="ink2 mono" font-size="11" text-anchor="middle">token = t1</text><text x="262.0" y="198.0" class="ink2 mono" font-size="11" text-anchor="middle">lease_until = now + 5분</text><path d="M437,130 L437,104 L694,104" class="lnG" stroke-width="1.6" marker-end="url(#mG)"/><text x="450.0" y="96.0" class="txG" font-size="11" text-anchor="start">완료: WHERE token = t1</text><path d="M522,162 L600,162 L600,224 L694,224" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><text x="608.0" y="246.0" class="txR" font-size="11" text-anchor="start">실패, 한도 초과</text><path d="M437,194 L437,262 L99,262 L99,196" class="lnA" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mA)"/><text x="268.0" y="254.0" class="txA" font-size="12" text-anchor="middle" font-weight="700">회수 스케줄러: lease_until 지남 → PENDING</text><rect x="24" y="290" width="832" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="40.0" y="312.0" class="ink" font-size="12" text-anchor="start">늦게 돌아온 워커(t1)는 이미 회수돼 새 실행(t2)이 잡은 뒤라 WHERE token = t1이 0행이다.</text><text x="40.0" y="330.0" class="ink2" font-size="12" text-anchor="start">그래서 새 실행의 결과를 덮어쓰지 못한다. SQS 가시성 타임아웃도 같은 원리다.</text></svg>
