<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="메모리 큐와 커밋 뒤 직접 발행은 커밋 직후 크래시에 작업을 잃고, Transactional Outbox는 DB에 남은 행으로 다시 보낸다"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.lnW { stroke: #ffffff; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="380" rx="8"/><text x="24.0" y="32.0" class="ink" font-size="16" text-anchor="start" font-weight="600">같은 시점에 죽어도, 작업을 어디에 뒀느냐에 따라 갈린다</text><text x="24.0" y="52.0" class="muted" font-size="12" text-anchor="start">세 방식 모두 DB 커밋 직후에 프로세스가 죽은 경우</text><rect x="24" y="76" width="140" height="72" rx="8" class="bgN stN" stroke-width="1.5"/><text x="94.0" y="107.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">메모리 큐</text><text x="94.0" y="125.0" class="ink2 mono" font-size="11" text-anchor="middle">@Async</text><rect x="188" y="76" width="150" height="72" rx="8" class="bgN stN" stroke-width="1.5"/><text x="263.0" y="107.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">DB 커밋</text><text x="263.0" y="125.0" class="ink2" font-size="11" text-anchor="middle">알림 작업은 메모리 큐에</text><line x1="338" y1="112" x2="400" y2="112" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><circle cx="366" cy="112" r="11" class="solR"/><path d="M361,107 L371,117 M371,107 L361,117" class="lnW" stroke-width="2.2"/><text x="366.0" y="94.0" class="txR" font-size="11" text-anchor="middle" font-weight="700">크래시</text><rect x="402" y="76" width="160" height="72" rx="8" class="bgN stN" stroke-width="1.5" stroke-dasharray="5 4"/><text x="482.0" y="107.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">작업 실행</text><text x="482.0" y="125.0" class="ink2" font-size="11" text-anchor="middle">알림 발송</text><line x1="562" y1="112" x2="594" y2="112" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="596" y="76" width="260" height="72" rx="8" class="bgR stR" stroke-width="1.5"/><text x="726.0" y="107.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">작업이 기록 없이 사라진다</text><text x="726.0" y="125.0" class="ink2" font-size="11" text-anchor="middle">다시 할 근거가 없다</text><rect x="24" y="172" width="140" height="72" rx="8" class="bgN stN" stroke-width="1.5"/><text x="94.0" y="203.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">커밋 뒤 직접 발행</text><text x="94.0" y="221.0" class="ink2 mono" font-size="11" text-anchor="middle">commit → send</text><rect x="188" y="172" width="150" height="72" rx="8" class="bgN stN" stroke-width="1.5"/><text x="263.0" y="203.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">DB 커밋</text><text x="263.0" y="221.0" class="ink2" font-size="11" text-anchor="middle">주문 저장</text><line x1="338" y1="208" x2="400" y2="208" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><circle cx="366" cy="208" r="11" class="solR"/><path d="M361,203 L371,213 M371,203 L361,213" class="lnW" stroke-width="2.2"/><text x="366.0" y="190.0" class="txR" font-size="11" text-anchor="middle" font-weight="700">크래시</text><rect x="402" y="172" width="160" height="72" rx="8" class="bgN stN" stroke-width="1.5" stroke-dasharray="5 4"/><text x="482.0" y="203.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">브로커 전송</text><text x="482.0" y="221.0" class="ink2" font-size="11" text-anchor="middle">아직 못 보냄</text><line x1="562" y1="208" x2="594" y2="208" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><rect x="596" y="172" width="260" height="72" rx="8" class="bgR stR" stroke-width="1.5"/><text x="726.0" y="203.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">주문은 있는데 이벤트가 없다</text><text x="726.0" y="221.0" class="ink2" font-size="11" text-anchor="middle">이중 쓰기의 틈</text><rect x="24" y="268" width="140" height="72" rx="8" class="bgN stN" stroke-width="1.5"/><text x="94.0" y="299.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">Transactional</text><text x="94.0" y="317.0" class="ink2" font-size="11" text-anchor="middle">Outbox</text><rect x="188" y="268" width="150" height="72" rx="8" class="bgG stG" stroke-width="1.5"/><text x="263.0" y="299.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">DB 커밋</text><text x="263.0" y="317.0" class="ink2" font-size="11" text-anchor="middle">주문 + outbox 행</text><line x1="338" y1="304" x2="400" y2="304" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><circle cx="366" cy="304" r="11" class="solR"/><path d="M361,299 L371,309 M371,299 L361,309" class="lnW" stroke-width="2.2"/><text x="366.0" y="286.0" class="txR" font-size="11" text-anchor="middle" font-weight="700">크래시</text><rect x="402" y="268" width="160" height="72" rx="8" class="bgN stN" stroke-width="1.5"/><text x="482.0" y="299.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">릴레이</text><text x="482.0" y="317.0" class="ink2" font-size="11" text-anchor="middle">재시작 후 행을 읽음</text><line x1="562" y1="304" x2="594" y2="304" class="lnG" stroke-width="1.6" marker-end="url(#mG)"/><rect x="596" y="268" width="260" height="72" rx="8" class="bgG stG" stroke-width="1.5"/><text x="726.0" y="299.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">남은 행을 다시 보낸다</text><text x="726.0" y="317.0" class="ink2" font-size="11" text-anchor="middle">대신 중복 발행 가능 (3.2)</text><text x="24.0" y="368.0" class="muted" font-size="11" text-anchor="start">점선 상자는 크래시 때문에 끝내 일어나지 않은 단계다.</text></svg>
