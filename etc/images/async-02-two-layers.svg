<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="비동기가 쓰이는 두 층인 시스템 연동 층과 코드 실행 층, 그리고 코드 실행 층의 동기 비동기 축과 블로킹 논블로킹 축을 2x2 표로 보여 준다"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.lnW { stroke: #ffffff; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="380" rx="8"/><text x="24.0" y="32.0" class="ink" font-size="16" text-anchor="start" font-weight="600">비동기라는 말은 두 층에서, 코드 실행 층에서는 두 축으로 쓰인다</text><text x="24.0" y="76.0" class="ink" font-size="13" text-anchor="start" font-weight="700">두 층</text><rect x="24" y="88" width="396" height="124" rx="8" class="bgB stB" stroke-width="1.5"/><text x="40.0" y="110.0" class="txB" font-size="12" text-anchor="start" font-weight="700">시스템 연동 층 (프로세스 밖)</text><rect x="40" y="124" width="100" height="40" rx="8" class="bgN stN" stroke-width="1.5"/><text x="90.0" y="148.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">API 서버</text><rect x="164" y="124" width="130" height="40" rx="8" class="bgA stA" stroke-width="1.5"/><text x="229.0" y="148.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">큐 · DB · 브로커</text><rect x="318" y="124" width="86" height="40" rx="8" class="bgN stN" stroke-width="1.5"/><text x="361.0" y="148.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">워커</text><line x1="140" y1="144" x2="162" y2="144" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="294" y1="144" x2="316" y2="144" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="40.0" y="194.0" class="ink" font-size="12" text-anchor="start">다루는 문제: 유실 · 중복 · 순서 · 일관성</text><rect x="24" y="226" width="396" height="124" rx="8" class="bgN stN" stroke-width="1.5"/><text x="40.0" y="248.0" class="ink" font-size="12" text-anchor="start" font-weight="700">코드 실행 층 (프로세스 안)</text><rect x="40" y="262" width="110" height="40" rx="8" class="bgN stN" stroke-width="1.5"/><text x="95.0" y="286.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">요청 스레드</text><rect x="304" y="262" width="100" height="40" rx="8" class="bgN stN" stroke-width="1.5"/><text x="354.0" y="286.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">결과</text><line x1="150" y1="282" x2="302" y2="282" class="lnB" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mB)"/><text x="222.0" y="274.0" class="txB" font-size="11" text-anchor="middle">Future · 콜백 · suspend</text><text x="40.0" y="332.0" class="ink" font-size="12" text-anchor="start">다루는 문제: 스레드 · 컨텍스트 · 디버깅</text><text x="452.0" y="76.0" class="ink" font-size="13" text-anchor="start" font-weight="700">코드 실행 층의 두 축</text><rect x="520" y="88" width="166" height="48" rx="8" class="bgN stN" stroke-width="1.5"/><text x="603.0" y="107.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">블로킹</text><text x="603.0" y="125.0" class="ink2" font-size="11" text-anchor="middle">대기 중 OS 스레드 점유</text><rect x="690" y="88" width="166" height="48" rx="8" class="bgN stN" stroke-width="1.5"/><text x="773.0" y="107.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">논블로킹</text><text x="773.0" y="125.0" class="ink2" font-size="11" text-anchor="middle">대기 중 OS 스레드 반납</text><text x="452.0" y="192.0" class="ink" font-size="13" text-anchor="start" font-weight="700">동기</text><text x="452.0" y="210.0" class="muted" font-size="10" text-anchor="start">결과를 바로</text><rect x="520" y="146" width="166" height="96" rx="8" class="bgR stR" stroke-width="1.5"/><text x="603.0" y="189.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">플랫폼 스레드에서</text><text x="603.0" y="207.3" class="ink" font-size="12" text-anchor="middle">JDBC 호출</text><rect x="690" y="146" width="166" height="96" rx="8" class="bgB stB" stroke-width="1.5"/><text x="773.0" y="189.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">가상 스레드에서</text><text x="773.0" y="207.3" class="ink" font-size="12" text-anchor="middle">JDBC 호출</text><text x="452.0" y="296.0" class="ink" font-size="13" text-anchor="start" font-weight="700">비동기</text><text x="452.0" y="314.0" class="muted" font-size="10" text-anchor="start">결과를 나중에</text><rect x="520" y="250" width="166" height="96" rx="8" class="bgA stA" stroke-width="1.5"/><text x="603.0" y="293.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">Future를 받고</text><text x="603.0" y="311.3" class="ink" font-size="12" text-anchor="middle">get()으로 대기</text><rect x="690" y="250" width="166" height="96" rx="8" class="bgG stG" stroke-width="1.5"/><text x="773.0" y="293.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">Reactor 콜백</text><text x="773.0" y="311.3" class="ink" font-size="12" text-anchor="middle">코루틴 suspend</text><text x="452.0" y="368.0" class="ink2" font-size="11" text-anchor="start">가상 스레드는 코드는 동기인데, 기다리는 동안 OS 스레드를 반납한다</text></svg>
