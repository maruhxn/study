<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="즉시 시도와 Task Queue 폴백의 흐름. 업무 트랜잭션에서 작업 행을 PENDING으로 함께 넣고, 커밋 뒤 메모리 큐로 바로 한 번 시도한다. 실패하거나 실행되지 못한 행은 PENDING으로 남고, 생성 뒤 N분의 유예가 지나면 폴링 워커가 다시 처리한다."><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.lnW { stroke: #ffffff; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="420" rx="8"/><text x="24" y="32" class="ink" font-size="16" text-anchor="start" font-weight="600">즉시 시도 + Task Queue 폴백</text><text x="24" y="52" class="muted" font-size="12" text-anchor="start">평소에는 메모리 큐에서 바로 끝나고, 남은 행은 유예가 지난 뒤 워커가 처리한다</text><rect x="24" y="76" width="220" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="134.0" y="103.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">업무 트랜잭션</text><text x="134.0" y="121" class="ink2" font-size="11" text-anchor="middle">업무 데이터 + 작업 행(PENDING)</text><line x1="244" y1="108" x2="306" y2="108" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="275" y="100" class="ink2" font-size="11" text-anchor="middle" font-weight="700">커밋 뒤</text><rect x="308" y="76" width="220" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="418.0" y="103.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">즉시 시도 (@Async)</text><text x="418.0" y="121" class="ink2" font-size="11" text-anchor="middle">메모리 큐, 지연이 짧다</text><line x1="528" y1="108" x2="590" y2="108" class="lnG" stroke-width="1.6" marker-end="url(#mG)"/><text x="559" y="100" class="ink2" font-size="11" text-anchor="middle" font-weight="700">성공</text><rect x="592" y="76" width="264" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="724.0" y="103.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">행을 DONE으로 바꾼다</text><text x="724.0" y="121" class="ink2" font-size="11" text-anchor="middle">대부분 여기서 끝난다</text><line x1="418" y1="140" x2="418" y2="198" class="lnR" stroke-width="1.6" marker-end="url(#mR)"/><text x="428" y="174" class="txR" font-size="12" text-anchor="start" font-weight="600">실패하거나 실행되지 못함</text><rect x="308" y="200" width="220" height="64" rx="8" class="bgR stR" stroke-width="1.5"/><text x="418.0" y="227.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">행이 PENDING으로 남는다</text><text x="418.0" y="245" class="ink2" font-size="11" text-anchor="middle">기록이 남아 유실되지 않는다</text><line x1="528" y1="232" x2="590" y2="232" class="lnA" stroke-width="1.6" marker-end="url(#mA)"/><text x="559" y="224" class="ink2" font-size="11" text-anchor="middle" font-weight="700">N분 뒤</text><rect x="592" y="200" width="264" height="64" rx="8" class="bgA stA" stroke-width="1.5"/><text x="724.0" y="227.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">폴링 워커가 다시 처리한다</text><text x="724.0" y="245" class="ink2" font-size="11" text-anchor="middle">적체 소진 속도 = 워커 처리 능력</text><rect x="308" y="306" width="284" height="20" rx="4" class="bgA stA" stroke-width="1"/><text x="450" y="320" class="txA" font-size="11" text-anchor="middle" font-weight="600">워커가 손대지 않는 유예 구간</text><line x1="24" y1="336" x2="856" y2="336" class="lnN" stroke-width="1.5"/><line x1="308" y1="300" x2="308" y2="342" class="lnI" stroke-width="1.5"/><line x1="592" y1="300" x2="592" y2="342" class="lnI" stroke-width="1.5"/><text x="308" y="358" class="ink2" font-size="11" text-anchor="middle">커밋 (created_at)</text><text x="592" y="358" class="ink2" font-size="11" text-anchor="middle">created_at + N분</text><text x="24" y="296" class="muted" font-size="11" text-anchor="start">시간</text><text x="24" y="386" class="ink2" font-size="12" text-anchor="start">유예는 created_at을 임대(4.4)처럼 쓰는 것이다. 큐가 가득 차 바로 거절된 건도 이 구간이 끝날 때까지 기다린다.</text><text x="24" y="404" class="ink2" font-size="12" text-anchor="start">즉시 시도와 워커가 모두 임대로 잡으면 유예를 없앨 수 있다. 유예를 남긴다면 거절된 건만 바로 재시도 대상으로 당긴다.</text></svg>
