<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="실패한 메시지는 지수 백오프와 지터로 재시도하고, 한도를 넘으면 DLQ로 옮겨 알람을 건다"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
