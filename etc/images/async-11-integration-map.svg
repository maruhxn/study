<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-label="연동 방식 다섯 가지가 작업을 두는 곳: 별도 스레드는 메모리 큐, 직접 전송은 브로커, Outbox는 outbox 테이블, 배치는 업무 테이블 원본, CDC는 DB 변경 로그"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.lnW { stroke: #ffffff; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="480" rx="8"/><text x="24.0" y="32.0" class="ink" font-size="16" text-anchor="start" font-weight="600">연동 방식은 작업을 어디에 두느냐로 갈린다</text><text x="24.0" y="52.0" class="muted" font-size="12" text-anchor="start">빨간 곳은 프로세스가 죽으면 사라지고, 업무 DB 안은 커밋되면 남는다</text><rect x="24" y="150" width="130" height="230" rx="8" class="bgN stN" stroke-width="1.5"/><text x="89.0" y="260.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">주문 API</text><text x="89.0" y="278.0" class="ink2" font-size="11" text-anchor="middle">앱 프로세스</text><rect x="204" y="76" width="230" height="46" rx="8" class="bgR stR" stroke-width="1.5"/><text x="319.0" y="103.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">프로세스 메모리 큐</text><path d="M89,150 L89,99 L202,99" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="484" y="76" width="140" height="46" rx="8" class="bgN stN" stroke-width="1.5"/><text x="554.0" y="103.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">① 작업 스레드</text><line x1="434" y1="99" x2="482" y2="99" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="154" y1="176" x2="672" y2="176" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="554.0" y="168.0" class="ink" font-size="12" text-anchor="middle" font-weight="700">② 직접 전송</text><rect x="190" y="214" width="258" height="220" rx="8" class="stN" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/><text x="204.0" y="234.0" class="ink2" font-size="12" text-anchor="start" font-weight="700">업무 DB</text><rect x="204" y="244" width="230" height="46" rx="8" class="bgG stG" stroke-width="1.5"/><text x="319.0" y="271.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">outbox 테이블</text><rect x="204" y="304" width="230" height="46" rx="8" class="bgN stN" stroke-width="1.5"/><text x="319.0" y="331.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">업무 테이블 원본</text><rect x="204" y="364" width="230" height="56" rx="8" class="bgA stA" stroke-width="1.5"/><text x="319.0" y="387.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">변경 로그</text><text x="319.0" y="405.0" class="ink2" font-size="11" text-anchor="middle">binlog · WAL, 커밋되면 쌓인다</text><line x1="154" y1="267" x2="202" y2="267" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="154" y1="327" x2="202" y2="327" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="484" y="244" width="140" height="46" rx="8" class="bgN stN" stroke-width="1.5"/><text x="554.0" y="271.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">③ 릴레이</text><rect x="484" y="304" width="140" height="46" rx="8" class="bgN stN" stroke-width="1.5"/><text x="554.0" y="331.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">④ 배치 잡</text><rect x="484" y="369" width="140" height="46" rx="8" class="bgN stN" stroke-width="1.5"/><text x="554.0" y="396.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">⑤ CDC 커넥터</text><line x1="434" y1="267" x2="482" y2="267" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="434" y1="327" x2="482" y2="327" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="434" y1="392" x2="482" y2="392" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="674" y="150" width="182" height="284" rx="8" class="bgB stB" stroke-width="1.5"/><text x="765.0" y="287.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">브로커</text><text x="765.0" y="305.0" class="ink2" font-size="11" text-anchor="middle">또는 대상 시스템</text><line x1="624" y1="267" x2="672" y2="267" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="624" y1="327" x2="672" y2="327" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><line x1="624" y1="392" x2="672" y2="392" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><text x="24.0" y="448.0" class="ink2" font-size="12" text-anchor="start">②는 전송이 끝나야 브로커에 남는다. 커밋 뒤 전송 전에 죽으면 사라진다.</text><text x="24.0" y="466.0" class="ink2" font-size="12" text-anchor="start">③과 ⑤를 합친 조합이 흔하다: CDC 커넥터가 outbox 테이블의 변경을 읽어 릴레이 역할을 한다.</text></svg>
