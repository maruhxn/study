<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="사가에서 재고 예약은 보상 가능 단계, 결제 승인은 피벗, 배송 요청과 알림은 재시도 가능 단계다. 피벗 전 실패는 보상하고 피벗 뒤 실패는 재시도로 끝낸다"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surface { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.bgN { fill: #f1f0eb; } .stN { stroke: #c3c2b7; }
.bgB { fill: #e8f1fc; } .stB { stroke: #2a78d6; } .txB { fill: #1d5fb0; }
.bgR { fill: #fbeaea; } .stR { stroke: #d03b3b; } .txR { fill: #b02a2a; }
.bgG { fill: #e4f6ed; } .stG { stroke: #1baf7a; } .txG { fill: #12785a; }
.bgA { fill: #fcf3dc; } .stA { stroke: #eda100; } .txA { fill: #8a5d00; }
.solR { fill: #d03b3b; } .solG { fill: #1baf7a; } .solA { fill: #eda100; } .solB { fill: #2a78d6; } .solI { fill: #52514e; }
.wh { fill: #ffffff; }
.lnI { stroke: #52514e; fill: none; } .lnR { stroke: #d03b3b; fill: none; } .lnG { stroke: #1baf7a; fill: none; }
.lnA { stroke: #eda100; fill: none; } .lnB { stroke: #2a78d6; fill: none; } .lnN { stroke: #c3c2b7; fill: none; }
.lnW { stroke: #ffffff; fill: none; }
.mkI { fill: #52514e; } .mkR { fill: #d03b3b; } .mkG { fill: #1baf7a; } .mkA { fill: #eda100; } .mkB { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .muted { fill: #9a9993; }
  .bgN { fill: #242422; } .stN { stroke: #55544f; }
  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="340" rx="8"/><text x="24.0" y="32.0" class="ink" font-size="16" text-anchor="start" font-weight="600">피벗 전 실패는 보상하고, 피벗 뒤 실패는 재시도로 끝낸다</text><text x="119.0" y="82.0" class="txG" font-size="12" text-anchor="middle" font-weight="700">보상 가능 단계</text><text x="349.0" y="82.0" class="txA" font-size="12" text-anchor="middle" font-weight="700">피벗 (되돌릴 수 없는 지점)</text><text x="670.0" y="82.0" class="txB" font-size="12" text-anchor="middle" font-weight="700">재시도 가능 단계</text><rect x="24" y="96" width="190" height="64" rx="8" class="bgG stG" stroke-width="1.5"/><text x="119.0" y="123.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">재고 예약</text><text x="119.0" y="141.0" class="ink2" font-size="11" text-anchor="middle">보상: 예약 해제</text><line x1="214" y1="128" x2="252" y2="128" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="254" y="96" width="190" height="64" rx="8" class="bgA stA" stroke-width="2.4"/><text x="349.0" y="123.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">결제 승인</text><text x="349.0" y="141.0" class="ink2" font-size="11" text-anchor="middle">외부 결제 대행사, 되돌릴 수 없다</text><line x1="444" y1="128" x2="482" y2="128" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="484" y="96" width="180" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="574.0" y="123.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">배송 요청</text><text x="574.0" y="141.0" class="ink2" font-size="11" text-anchor="middle">멱등, 성공할 때까지</text><line x1="664" y1="128" x2="702" y2="128" class="lnI" stroke-width="1.6" marker-end="url(#mI)"/><rect x="704" y="96" width="152" height="64" rx="8" class="bgB stB" stroke-width="1.5"/><text x="780.0" y="123.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">알림</text><text x="780.0" y="141.0" class="ink2" font-size="11" text-anchor="middle">멱등, 성공할 때까지</text><path d="M349,160 L349,206 L119,206 L119,162" class="lnR" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mR)"/><text x="234.0" y="224.0" class="txR" font-size="12" text-anchor="middle" font-weight="700">결제 실패 → 예약 해제로 보상</text><path d="M540,160 L540,206 L608,206 L608,162" class="lnB" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mB)"/><text x="574.0" y="224.0" class="txB" font-size="12" text-anchor="middle" font-weight="700">배송 실패 → 재시도</text><rect x="24" y="252" width="832" height="66" rx="8" class="bgN stN" stroke-width="1.5"/><text x="40.0" y="276.0" class="ink" font-size="12" text-anchor="start">보상은 롤백이 아니다. 이미 커밋된 업무 효과를 업무 규칙에 맞게 상쇄하는 새 작업이고, 보상도 멱등해야 한다.</text><text x="40.0" y="298.0" class="ink2" font-size="12" text-anchor="start">재고·한도처럼 실패할 수 있는 검증을 피벗 앞에 두면, 피벗 뒤에서 실패할 일과 보상할 일이 줄어든다.</text></svg>
