  .bgB { fill: #1b2b40; } .stB { stroke: #3987e5; } .txB { fill: #7db3f2; }
  .bgR { fill: #3a2020; } .stR { stroke: #e05a5a; } .txR { fill: #f08a8a; }
  .bgG { fill: #1b3328; } .stG { stroke: #199e70; } .txG { fill: #5fd1a6; }
  .bgA { fill: #3a2f14; } .stA { stroke: #c98500; } .txA { fill: #e8b64a; }
  .solR { fill: #e05a5a; } .solG { fill: #199e70; } .solA { fill: #c98500; } .solB { fill: #3987e5; } .solI { fill: #c3c2b7; }
  .lnI { stroke: #c3c2b7; } .lnR { stroke: #e05a5a; } .lnG { stroke: #199e70; } .lnA { stroke: #c98500; } .lnB { stroke: #3987e5; } .lnN { stroke: #55544f; }
  .mkI { fill: #c3c2b7; } .mkR { fill: #e05a5a; } .mkG { fill: #199e70; } .mkA { fill: #c98500; } .mkB { fill: #3987e5; }
}
</style><defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkI"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkR"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkG"/></marker><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkA"/></marker><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkB"/></marker></defs><rect class="surface" x="0" y="0" width="880" height="400" rx="8"/><text x="24.0" y="32.0" class="ink" font-size="16" text-anchor="start" font-weight="600">IO를 기다리는 동안 스레드를 어떻게 쓰나</text><text x="24.0" y="52.0" class="muted" font-size="12" text-anchor="start">요청 하나가 DB 응답을 기다리는 동안</text><rect x="24" y="76" width="180" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="114.0" y="97.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">스레드 풀 + Future</text><text x="114.0" y="115.0" class="ink2" font-size="11" text-anchor="middle">@Async, CompletableFuture</text><rect x="220" y="76" width="90" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="265.0" y="106.0" class="ink" font-size="11" text-anchor="middle" font-weight="600">요청 처리</text><rect x="310" y="76" width="330" height="52" rx="8" class="bgR stR" stroke-width="1.5"/><text x="475.0" y="106.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">대기: 스레드를 붙잡고 있다</text><rect x="640" y="76" width="90" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="685.0" y="106.0" class="ink" font-size="11" text-anchor="middle" font-weight="600">결과 처리</text><text x="793.0" y="107.0" class="txR" font-size="13" text-anchor="middle" font-weight="700">점유</text><rect x="24" y="138" width="180" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="114.0" y="159.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">리액티브</text><text x="114.0" y="177.0" class="ink2" font-size="11" text-anchor="middle">Reactor, WebFlux</text><rect x="220" y="138" width="90" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="265.0" y="168.0" class="ink" font-size="11" text-anchor="middle" font-weight="600">요청 처리</text><rect x="310" y="138" width="330" height="52" rx="8" class="bgB stB" stroke-width="1.5" stroke-dasharray="5 4"/><text x="475.0" y="168.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">대기: 이벤트 루프는 다른 요청 처리</text><rect x="640" y="138" width="90" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="685.0" y="168.0" class="ink" font-size="11" text-anchor="middle" font-weight="600">결과 처리</text><text x="793.0" y="169.0" class="txG" font-size="13" text-anchor="middle" font-weight="700">반납</text><rect x="24" y="200" width="180" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="114.0" y="221.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">코루틴</text><text x="114.0" y="239.0" class="ink2" font-size="11" text-anchor="middle">Kotlin suspend</text><rect x="220" y="200" width="90" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="265.0" y="230.0" class="ink" font-size="11" text-anchor="middle" font-weight="600">요청 처리</text><rect x="310" y="200" width="330" height="52" rx="8" class="bgB stB" stroke-width="1.5" stroke-dasharray="5 4"/><text x="475.0" y="230.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">대기: suspend 지점에서 스레드 반납</text><rect x="640" y="200" width="90" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="685.0" y="230.0" class="ink" font-size="11" text-anchor="middle" font-weight="600">결과 처리</text><text x="793.0" y="231.0" class="txG" font-size="13" text-anchor="middle" font-weight="700">반납</text><rect x="24" y="262" width="180" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="114.0" y="283.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">가상 스레드</text><text x="114.0" y="301.0" class="ink2" font-size="11" text-anchor="middle">JDK 21+</text><rect x="220" y="262" width="90" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="265.0" y="292.0" class="ink" font-size="11" text-anchor="middle" font-weight="600">요청 처리</text><rect x="310" y="262" width="330" height="52" rx="8" class="bgB stB" stroke-width="1.5" stroke-dasharray="5 4"/><text x="475.0" y="292.3" class="ink" font-size="12" text-anchor="middle" font-weight="600">대기: 캐리어(OS) 스레드 반납</text><rect x="640" y="262" width="90" height="52" rx="8" class="bgN stN" stroke-width="1.5"/><text x="685.0" y="292.0" class="ink" font-size="11" text-anchor="middle" font-weight="600">결과 처리</text><text x="793.0" y="293.0" class="txG" font-size="13" text-anchor="middle" font-weight="700">반납</text><rect x="24" y="330" width="832" height="52" rx="8" class="bgA stA" stroke-width="1.5"/><text x="40.0" y="352.0" class="ink" font-size="12" text-anchor="start" font-weight="600">넷 다 작업은 프로세스 메모리에 있다. 프로세스가 죽으면 진행 중이던 작업도 사라진다.</text><text x="40.0" y="370.0" class="ink2" font-size="12" text-anchor="start">실행 모델은 스레드를 아낄 뿐, 유실을 막으려면 브로커나 DB에 두는 방식(3절)과 같이 쓴다.</text></svg>
