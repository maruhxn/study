<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="스레드 풀은 IO 대기 내내 스레드를 점유하고, 리액티브는 이벤트 루프가 다른 요청을 처리하며, 코루틴은 suspend로, 가상 스레드는 캐리어 반납으로 대기 중 스레드를 반납한다"><style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
